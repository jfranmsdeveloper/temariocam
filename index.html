<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Mapa Normativo Estratégico</title>
<style>
:root[data-theme="dark"] {
  --bg: #05070a;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --accent: #00a2ff;
  --gold: #ffcc00;
  --liquid-1: rgba(0, 162, 255, 0.2);
  --liquid-2: rgba(255, 204, 0, 0.15);
  --shadow: 0 20px 50px rgba(0,0,0,0.5);
}

:root[data-theme="light"] {
  --bg: #f5f7fa;
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: rgba(255, 255, 255, 0.9);
  --line: rgba(0, 0, 0, 0.05);
  --text: #1d1d1f;
  --text-muted: rgba(0, 0, 0, 0.5);
  --accent: #0071e3;
  --gold: #bf8f00;
  --liquid-1: rgba(0, 113, 227, 0.1);
  --liquid-2: rgba(255, 149, 0, 0.1);
  --shadow: 0 20px 40px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; transition: background-color 0.4s, color 0.4s, border-color 0.4s, transform 0.3s; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.liquid { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; animation: drift 20s infinite alternate; }
.l1 { width: 600px; height: 600px; background: var(--liquid-1); top: -200px; left: -100px; }
.l2 { width: 500px; height: 500px; background: var(--liquid-2); bottom: -100px; right: -100px; animation-delay: -5s; }

@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px, 30px) scale(1.1); } }

.app { max-width: 1300px; margin: auto; padding: 40px 24px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 60px; }
.brand h1 { font-size: 42px; letter-spacing: -1.5px; margin: 0; font-weight: 800; }
.brand p { color: var(--text-muted); margin: 8px 0 0; font-size: 18px; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 8px; border-radius: 14px; cursor: pointer; display: flex; gap: 4px; backdrop-filter: blur(10px); }
.toggle span { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.toggle .active { background: var(--accent); color: white; }

.nav-bar { display: flex; gap: 16px; margin-bottom: 40px; align-items: center; position: sticky; top: 20px; z-index: 100; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 14px 20px; border-radius: 18px; backdrop-filter: blur(25px); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 16px; outline: none; }
.filter-tabs { display: flex; background: var(--surface); padding: 6px; border-radius: 18px; border: 1px solid var(--line); backdrop-filter: blur(25px); }
.tab { border: none; background: none; color: var(--text-muted); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.tab.active { background: var(--surface-hover); color: var(--text); }

/* Grouping Styles */
.block-group { margin-bottom: 60px; }
.block-header { 
  font-size: 13px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 24px; display: flex; align-items: center; gap: 12px;
}
.block-header::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 32px; padding: 30px;
  backdrop-filter: blur(30px) saturate(180%); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden;
}
.card:hover { background: var(--surface-hover); transform: translateY(-5px); }

.card-meta { display: flex; justify-content: space-between; align-items: center; }
.card-num { font-size: 13px; font-weight: 900; color: var(--gold); }
.badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; }
.badge-high { background: rgba(255, 59, 48, 0.15); color: #ff3b30; }
.badge-mid { background: rgba(255, 159, 10, 0.15); color: #ff9f0a; }

.card-title { font-size: 20px; font-weight: 750; line-height: 1.3; margin: 0; }
.law-list { display: flex; flex-direction: column; gap: 12px; }
.law-item { font-size: 14px; }
.law-name { color: var(--accent); font-weight: 700; text-decoration: none; margin-bottom: 4px; display: block; }
.law-arts { color: var(--text-muted); line-height: 1.5; }

.focus-box { background: rgba(0, 162, 255, 0.05); padding: 14px; border-radius: 18px; border-left: 4px solid var(--accent); font-size: 13px; }
.footer-actions { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.prog-btn { background: var(--surface-hover); border: 1px solid var(--line); color: var(--text); padding: 8px 16px; border-radius: 14px; font-size: 12px; font-weight: 650; cursor: pointer; }
.prog-Dominado { border-color: #34c759; color: #34c759; }

@media (max-width: 768px) {
  header { flex-direction: column; gap: 20px; }
  .nav-bar { flex-direction: column; position: static; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p>Mapa Normativo Estratégico</p></div>
    <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Busca leyes o temas..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1</button>
      <button class="tab" data-exam="c2">C2</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<script>
const LAW_URLS = {
  'Constitución': 'https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229',
  'Ley 39/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565',
  'Ley 40/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566',
  'TREBEP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719',
  'LCSP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902',
  'Estatuto': 'https://www.boe.es/buscar/act.php?id=BOE-A-1995-6544',
  'TRLRHL': 'https://www.boe.es/buscar/act.php?id=BOE-A-2004-4244'
};

const BLOCKS = [
  { id: 'b1', name: 'Bloque I: Derecho Constitucional y Organización' },
  { id: 'b2', name: 'Bloque II: Derecho Administrativo y Procedimiento' },
  { id: 'b3', name: 'Bloque III: Gestión de Personal y Contratación' },
  { id: 'b4', name: 'Bloque IV: Haciendas Locales y Organización CAM' }
];

const DATA = [
  {id:'c1-t1', bloque:'b1', exam:'c1', num:'T1', title:'La Constitución Española', prio:'high', focus:'Arts. 1-55. Especial atención a Derechos Fundamentales (14-29).', laws:[{n:'Constitución', arts:'Título Preliminar y Título I'}]},
  {id:'c1-t6', bloque:'b1', exam:'c1', num:'T6', title:'Estatuto de Autonomía de Melilla', prio:'high', focus:'Art. 21.1 (Competencias exclusivas) y Organización Institucional.', laws:[{n:'Estatuto', arts:'Íntegro'}]},
  {id:'c1-t10', bloque:'b2', exam:'c1', num:'T10', title:'El Interesado y Representación', prio:'high', focus:'Capacidad (Art. 3) y Acreditación de representación (Art. 5).', laws:[{n:'Ley 39/2015', arts:'Arts. 3-12'}]},
  {id:'c1-t11', bloque:'b2', exam:'c1', num:'T11', title:'Términos y Plazos', prio:'mid', focus:'Cómputo en días hábiles/naturales y horas (Art. 30).', laws:[{n:'Ley 39/2015', arts:'Arts. 29-33'}]},
  {id:'c1-t12', bloque:'b2', exam:'c1', num:'T12', title:'Actos Administrativos', prio:'high', focus:'Motivación (Art. 35) y Notificación (Arts. 40-44).', laws:[{n:'Ley 39/2015', arts:'Arts. 34-46'}]},
  {id:'c1-t19', bloque:'b3', exam:'c1', num:'T19', title:'Contratos del Sector Público', prio:'high', focus:'Tipos de contratos y Umbrales SARA (actualizados).', laws:[{n:'LCSP', arts:'Arts. 1-27'}]},
  {id:'c1-t25', bloque:'b3', exam:'c1', num:'T25', title:'Contratos Menores', prio:'high', focus:'Límites (15k/40k) y prohibición de fraccionamiento.', laws:[{n:'LCSP', arts:'Art. 118'}]},
  {id:'c1-t28', bloque:'b3', exam:'c1', num:'T28', title:'Personal al Servicio de AAPP (TREBEP)', prio:'high', focus:'Clases de personal (Arts. 8-12) y Requisitos de acceso (Art. 56).', laws:[{n:'TREBEP', arts:'Arts. 1-13, 55-62'}]},
  {id:'c1-t29', bloque:'b4', exam:'c1', num:'T29', title:'Haciendas Locales: Recursos', prio:'mid', focus:'Tasas vs Precios Públicos (Concepto y diferencia).', laws:[{n:'TRLRHL', arts:'Arts. 2, 20-27, 41-47'}]},
  {id:'c2-t1', bloque:'b1', exam:'c2', num:'T1', title:'Constitución: Derechos y Deberes', prio:'high', focus:'Título I completo.', laws:[{n:'Constitución', arts:'Título I'}]},
  {id:'c2-t10', bloque:'b2', exam:'c2', num:'T10', title:'Procedimiento Administrativo Común', prio:'high', focus:'Derechos del interesado (Art. 13).', laws:[{n:'Ley 39/2015', arts:'Arts. 13-28'}]}
];

// Nota: He incluido los temas principales recuperados. Se pueden añadir los 75 temas siguiendo este patrón.

let state = {
  theme: localStorage.getItem('theme') || 'dark',
  exam: 'all',
  q: '',
  progress: JSON.parse(localStorage.getItem('progress') || '{}')
};

function getUrl(name) {
  for (let k in LAW_URLS) if (name.includes(k)) return LAW_URLS[k];
  return '#';
}

function render() {
  const container = document.getElementById('content');
  const filtered = DATA.filter(d => {
    const matchExam = state.exam === 'all' || d.exam === state.exam;
    const txt = (d.title + d.num + d.focus).toLowerCase();
    const matchSearch = txt.includes(state.q.toLowerCase());
    return matchExam && matchSearch;
  });

  const grouped = BLOCKS.map(b => ({
    ...b,
    items: filtered.filter(item => item.bloque === b.id)
  })).filter(b => b.items.length > 0);

  container.innerHTML = grouped.map(block => `
    <section class="block-group">
      <div class="block-header">${block.name}</div>
      <div class="grid">
        ${block.items.map(item => {
          const prog = state.progress[item.id] || 'Pendiente';
          return `
            <article class="card">
              <div class="card-meta">
                <span class="card-num">${item.num} · ${item.exam.toUpperCase()}</span>
                <span class="badge badge-${item.prio}">${item.prio === 'high' ? 'Crítico' : 'Importante'}</span>
              </div>
              <h2 class="card-title">${item.title}</h2>
              <div class="law-list">
                ${item.laws.map(l => `
                  <div class="law-item">
                    <a href="${getUrl(l.n)}" class="law-name" target="_blank">${l.n} ↗</a>
                    <span class="law-arts">${l.arts}</span>
                  </div>
                `).join('')}
              </div>
              <div class="focus-box">🎯 Al grano: ${item.focus}</div>
              <div class="footer-actions">
                <button class="prog-btn prog-${prog}" onclick="toggleProg('${item.id}')">${prog}</button>
              </div>
            </article>
          `;
        }).join('')}
      </div>
    </section>
  `).join('');

  if (grouped.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding: 40px; opacity: 0.5;">No se han encontrado temas con esos filtros.</div>';
  }
}

window.toggleProg = (id) => {
  const steps = ['Pendiente', 'Leído', 'Dominado'];
  let cur = steps.indexOf(state.progress[id] || 'Pendiente');
  state.progress[id] = steps[(cur + 1) % 3];
  localStorage.setItem('progress', JSON.stringify(state.progress));
  render();
};

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => {
    s.classList.toggle('active', s.dataset.v === state.theme);
  });
}

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => {
  state.q = e.target.value;
  render();
};

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

setUI();
render();
</script>
</body></html>
