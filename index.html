<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — El Estratega</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --bg: #05070a; --surface: rgba(255, 255, 255, 0.04); --surface-hover: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1); --text: #ffffff; --text-muted: rgba(255, 255, 255, 0.6);
  --accent: #00a2ff; --gold: #ffcc00; --shadow: 0 24px 60px rgba(0,0,0,0.5);
}

:root[data-theme="light"] {
  --bg: #f8fafc; --surface: rgba(255, 255, 255, 0.7); --surface-hover: rgba(255, 255, 255, 0.95);
  --line: rgba(0, 0, 0, 0.05); --text: #0f172a; --text-muted: #64748b;
  --accent: #2563eb; --gold: #b45309; --shadow: 0 20px 40px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; transition: background-color 0.4s, color 0.4s; }
body {
  margin: 0; min-height: 100vh; font-family: 'Inter', sans-serif;
  background-color: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased;
}

.liquid { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; opacity: 0.15; }
.l1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -100px; }
.l2 { width: 500px; height: 500px; background: var(--gold); bottom: -100px; right: -100px; }

.app { max-width: 1400px; margin: auto; padding: 40px 24px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 50px; }
.brand h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin: 0; letter-spacing: -1.5px; }
.brand p { color: var(--text-muted); margin: 6px 0 0; font-size: 18px; font-weight: 600; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 5px; border-radius: 12px; cursor: pointer; display: flex; gap: 4px; backdrop-filter: blur(10px); }
.toggle span { padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; }
.toggle .active { background: var(--accent); color: white; }

.nav-bar { display: flex; gap: 16px; margin-bottom: 40px; position: sticky; top: 20px; z-index: 100; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 14px 20px; border-radius: 18px; backdrop-filter: blur(25px); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 16px; outline: none; }
.filter-tabs { display: flex; background: var(--surface); padding: 5px; border-radius: 16px; border: 1px solid var(--line); backdrop-filter: blur(25px); }
.tab { border: none; background: none; color: var(--text-muted); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 13px; }
.tab.active { background: var(--surface-hover); color: var(--text); }

/* Accordion Blocks */
.block-container { margin-bottom: 20px; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; background: var(--surface); backdrop-filter: blur(20px); }
.block-header { padding: 24px 30px; background: var(--surface-hover); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.block-header h3 { margin: 0; font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); letter-spacing: 1px; }
.block-header .arrow { transition: transform 0.3s; font-size: 14px; opacity: 0.5; }
.block-content { padding: 30px; display: none; }
.block-container.open .block-content { display: block; }
.block-container.open .arrow { transform: rotate(180deg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px;
  backdrop-filter: blur(40px) saturate(180%); display: flex; flex-direction: column; gap: 15px; cursor: pointer;
}
.card:hover { border-color: var(--accent); background: var(--surface-hover); }
.card-num { font-size: 12px; font-weight: 900; color: var(--gold); letter-spacing: 1px; opacity: 0.8; }
.card-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; line-height: 1.2; margin: 0; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
  z-index: 1000; display: none; place-items: center; padding: 20px;
}
.modal-content {
  background: var(--bg); border: 1px solid var(--line); border-radius: 40px;
  width: 100%; max-width: 1000px; max-height: 90vh; overflow-y: auto;
  position: relative; padding: 60px; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
}
.close-modal { position: absolute; top: 30px; right: 30px; cursor: pointer; opacity: 0.5; font-size: 24px; }

.modal-header { margin-bottom: 40px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
.modal-header .num { font-size: 13px; font-weight: 900; color: var(--gold); display: block; margin-bottom: 8px; }
.modal-header h2 { font-family: 'Playfair Display', serif; font-size: 32px; margin: 0; line-height: 1.2; }

.law-block { margin-bottom: 40px; }
.law-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--accent); margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 15px; }

.outline-list { list-style: none; padding: 0; margin: 0; }
.outline-item { margin-bottom: 15px; padding-left: 25px; position: relative; line-height: 1.7; font-size: 16px; }
.outline-item::before { content: "🎯"; position: absolute; left: 0; top: 2px; font-size: 14px; }
.outline-item b { color: var(--gold); font-weight: 800; border-bottom: 1px solid rgba(255,204,0,0.2); }

.sub-list { list-style: none; padding-left: 20px; margin: 10px 0; border-left: 2px solid var(--line); }
.sub-item { margin-bottom: 8px; font-size: 15px; color: var(--text-muted); position: relative; padding-left: 15px; }
.sub-item::before { content: "→"; position: absolute; left: 0; opacity: 0.4; color: var(--accent); }

@media (max-width: 768px) {
  .modal-content { padding: 30px; }
  .modal-header h2 { font-size: 24px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p>The Strategist — C1/C2 Melilla</p></div>
    <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Busca por tema, ley o artículo..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1</button>
      <button class="tab" data-exam="c2">C2</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">✕</span>
    <div id="modalBody"></div>
  </div>

  {n:"RDL 5/2015, de 30 de octubre, TREBEP (Estatuto Básico del Empleado Público)",arts:"Arts. 1–15, 21–30, 47–68, 93–98"}
]}
];

const BLOCKS = [
  { id: 'b1', name: 'Bloque I: Constitución y Organización del Estado', range: {c1: [1,5], c2: [1,9]} },
  { id: 'b2', name: 'Bloque II: Melilla y el Estatuto de Autonomía', range: {c1: [6,6, 33,36], c2: [10,14]} },
  { id: 'b3', name: 'Bloque III: Derecho Administrativo y Procedimiento', range: {c1: [9,18], c2: ['E1','E5']} },
  { id: 'b4', name: 'Bloque IV: Régimen Local, Haciendas y Patrimonio', range: {c1: [7,8, 32,32, 37,42], c2: [15,16, 'E6','E11', 'E15','E16']} },
  { id: 'b5', name: 'Bloque V: Contratación y Función Pública (TREBEP)', range: {c1: [19,25, 28,31], c2: ['E12','E13', 'E17','E17']} }
];

const ALL_DATA = [
  ...C1.map(x => ({...x, exam:'c1', id:'c1-'+x.num})),
  ...C2.map(x => ({...x, exam:'c2', id:'c2-'+x.num}))
];

let state = {
  theme: localStorage.getItem('theme') || 'dark',
  exam: 'all', q: '',
  openBlocks: new Set(['b1'])
};

function getBlockId(item) {
  const n = item.num;
  const isC1 = item.exam === 'c1';
  for (const b of BLOCKS) {
    const r = isC1 ? b.range.c1 : b.range.c2;
    for (let i = 0; i < r.length; i += 2) {
      const start = r[i];
      const end = r[i+1];
      if (typeof n === 'string' && n.startsWith('T')) {
        const val = parseInt(n.substring(1));
        if (val >= start && val <= end) return b.id;
      } else if (typeof n === 'string' && n.startsWith('E')) {
        if (typeof start === 'string' && start.startsWith('E')) {
          const val = parseInt(n.substring(1));
          const sVal = parseInt(start.substring(1));
          const eVal = parseInt(end.substring(1));
          if (val >= sVal && val <= eVal) return b.id;
        }
      }
    }
  }
  return 'b4'; // Default
}

function parseArts(text) {
  const parts = text.split(/\s\+\s/);
  return `<ul class="outline-list">${parts.map(p => {
    const subParts = p.split(/\s[—:]\s/);
    const main = subParts[0].replace(/Art[s]?\.\s*(\d+)/g, '<b>Art. $1</b>');
    const subs = subParts.slice(1);
    return `
      <li class="outline-item">
        ${main}
        ${subs.length ? `<ul class="sub-list">${subs.map(s => `<li class="sub-item">${s}</li>`).join('')}</ul>` : ''}
      </li>
    `;
  }).join('')}</ul>`;
}

function render() {
  const container = document.getElementById('content');
  const filtered = ALL_DATA.filter(d => {
    return (state.exam === 'all' || d.exam === state.exam) && 
           (d.enunciado + d.num).toLowerCase().includes(state.q.toLowerCase());
  });

  const grouped = BLOCKS.map(b => ({
    ...b,
    items: filtered.filter(item => getBlockId(item) === b.id)
  })).filter(b => b.items.length > 0);

  container.innerHTML = grouped.map(block => `
    <div class="block-container ${state.openBlocks.has(block.id) ? 'open' : ''}" id="${block.id}">
      <div class="block-header" onclick="toggleBlock('${block.id}')">
        <h3>${block.name}</h3>
        <span class="arrow">▼</span>
      </div>
      <div class="block-content">
        <div class="grid">
          ${block.items.map(item => `
            <article class="card" onclick="openModal('${item.id}')">
              <div class="card-num">${item.num} · ${item.exam.toUpperCase()}</div>
              <h2 class="card-title">${item.enunciado}</h2>
            </article>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

window.toggleBlock = (id) => {
  if (state.openBlocks.has(id)) state.openBlocks.delete(id);
  else state.openBlocks.add(id);
  render();
};

window.openModal = (id) => {
  const item = ALL_DATA.find(d => d.id === id);
  const body = document.getElementById('modalBody');

  body.innerHTML = `
    <div class="modal-header">
      <span class="num">${item.exam.toUpperCase()} · TEMA ${item.num}</span>
      <h2>${item.enunciado}</h2>
    </div>
    <div class="laws-container">
      ${item.leyes.map(l => `
        <div class="law-block">
          <div class="law-title">${l.n}</div>
          ${parseArts(l.arts)}
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('modal').style.display = 'grid';
  document.body.style.overflow = 'hidden';
};

window.closeModal = () => {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = 'auto';
};

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => s.classList.toggle('active', s.dataset.v === state.theme));
}

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => { state.q = e.target.value; render(); };

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

window.onclick = (e) => { if (e.target.id === 'modal') closeModal(); };

setUI();
render();
</script>
</body></html>
