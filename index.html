<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Melilla Strategic Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --melilla-blue: #007AFF;
  --melilla-gold: #FFD700;
  --bg: #030509;
  --surface: rgba(255, 255, 255, 0.03);
  --surface-hover: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.5);
  --glass-blur: blur(60px);
}

:root[data-theme="light"] {
  --melilla-blue: #007AFF;
  --melilla-gold: #D4AF37;
  --bg: #F0F4F8;
  --surface: rgba(255, 255, 255, 0.6);
  --surface-hover: rgba(255, 255, 255, 0.85);
  --line: rgba(0, 0, 0, 0.04);
  --text: #0A1128;
  --text-muted: #546E7A;
  --glass-blur: blur(40px);
}

* { box-sizing: border-box; transition: all 0.5s cubic-bezier(0.1, 0.8, 0.2, 1); }
body {
  margin: 0; min-height: 100vh; font-family: 'Inter', sans-serif;
  background-color: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased;
}

.liquid { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; pointer-events: none; opacity: 0.4; animation: drift 25s infinite alternate; }
.l1 { width: 800px; height: 800px; background: radial-gradient(circle, var(--melilla-blue) 0%, transparent 70%); top: -300px; left: -200px; }
.l2 { width: 600px; height: 600px; background: radial-gradient(circle, #AF52DE 0%, transparent 70%); bottom: -200px; right: -200px; animation-delay: -10s; }

@keyframes drift { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(100px, 50px) rotate(30deg); } }

.app { max-width: 1400px; margin: auto; padding: 60px 24px; }

header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
.brand h1 { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 900; margin: 0; letter-spacing: -3px; color: var(--melilla-blue); }
.brand p { color: var(--text-muted); margin: 8px 0 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 16px; cursor: pointer; display: flex; backdrop-filter: var(--glass-blur); }
.toggle span { padding: 6px 16px; border-radius: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
.toggle .active { background: var(--melilla-blue); color: white; }

.nav-bar { display: flex; gap: 20px; margin-bottom: 50px; position: sticky; top: 30px; z-index: 1000; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 18px 24px; border-radius: 24px; backdrop-filter: var(--glass-blur); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 18px; outline: none; font-weight: 600; }

.filter-tabs { display: flex; background: var(--surface); padding: 4px; border-radius: 20px; border: 1px solid var(--line); backdrop-filter: var(--glass-blur); }
.tab { border: none; background: none; color: var(--text-muted); padding: 10px 24px; border-radius: 16px; cursor: pointer; font-weight: 800; font-size: 14px; }
.tab.active { background: var(--surface-hover); color: var(--text); }

.block-container { margin-bottom: 24px; border: 1px solid var(--line); border-radius: 40px; background: var(--surface); backdrop-filter: var(--glass-blur); overflow: hidden; }
.block-header { padding: 35px 45px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.block-header h3 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.block-header .icon-wrap { display: flex; align-items: center; gap: 20px; }
.block-header .icon-wrap svg { width: 32px; height: 32px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; padding: 45px; border-top: 1px solid var(--line); }

.card {
  background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 32px; padding: 35px;
  display: flex; flex-direction: column; gap: 20px; cursor: pointer;
}
.card:hover { transform: scale(1.02) translateY(-10px); background: rgba(255,255,255,0.05); }
.card-num { font-size: 14px; font-weight: 900; color: var(--melilla-gold); letter-spacing: 2px; }
.card-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin: 0; line-height: 1.25; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(25px); z-index: 2000; display: none; place-items: center; padding: 24px; }
.modal-content {
  background: var(--bg); border: 1px solid var(--line); border-radius: 50px;
  width: 100%; max-width: 1100px; max-height: 90vh; overflow-y: auto;
  position: relative; padding: 80px;
}
.close-modal { position: absolute; top: 40px; right: 40px; cursor: pointer; opacity: 0.4; font-size: 30px; }

.modal-header h2 { font-family: 'Playfair Display', serif; font-size: 48px; color: var(--melilla-blue); margin: 20px 0; }

.law-block { margin-bottom: 50px; border-left: 6px solid var(--melilla-blue); padding-left: 40px; }
.law-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--melilla-gold); margin-bottom: 30px; }

.outline-list { list-style: none; padding: 0; }
.outline-item { margin-bottom: 25px; position: relative; font-size: 18px; line-height: 1.6; }

.sub-list { list-style: none; padding-left: 20px; margin-top: 15px; border-left: 2px solid var(--line); }
.sub-item { font-size: 16px; color: var(--text-muted); margin-bottom: 12px; position: relative; }

@media (max-width: 1024px) {
  .modal-content { padding: 40px; }
  .grid { grid-template-columns: 1fr; padding: 24px; }
}

.block-container.drag-over { border-color: var(--melilla-gold); background: rgba(255, 215, 0, 0.05); }
.card[draggable="true"] { cursor: grab; }
.card[draggable="true"]:active { cursor: grabbing; }
.card.dragging { opacity: 0.4; transform: scale(0.95); }

.block-select {
  background: var(--surface-hover); border: 1px solid var(--line); color: var(--text);
  padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; outline: none;
  width: 100%; margin-top: 10px; cursor: pointer; backdrop-filter: var(--glass-blur);
}
.block-select:focus { border-color: var(--melilla-gold); }

.sort-btn {
  background: none; border: none; padding: 8px; cursor: pointer; opacity: 0.4;
  display: flex; align-items: center; justify-content: center; border-radius: 8px;
}
.sort-btn:hover { opacity: 1; background: var(--surface-hover); }
.sort-btn svg { width: 18px; height: 18px; fill: var(--text); }

.sub-header {
  padding: 20px 45px 10px;
  font-size: 14px; font-weight: 900; letter-spacing: 2px;
  color: var(--text-muted); text-transform: uppercase;
  display: flex; align-items: center; gap: 15px;
}
.sub-header::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.edit-btn { background: var(--surface); border: 1px solid var(--line); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text-muted); display: flex; align-items: center; gap: 8px; backdrop-filter: var(--glass-blur); }

.edit-btn.active { border-color: var(--melilla-gold); color: var(--melilla-gold); }

  .analysis-btn { background: var(--melilla-blue); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,122,255,0.2); }
  .analysis-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,122,255,0.4); background: #0066d6; }
  .analysis-btn svg { width: 16px; height: 16px; fill: white; }

  #analysisDashboard {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(50px) saturate(180%);
    z-index: 3000; display: none; overflow-y: auto; padding: 60px 40px;
    color: #1d1d1f;
  }
  #analysisDashboard.active { display: block; animation: dashFade 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes dashFade { from { opacity:0; backdrop-filter: blur(0px); } to { opacity:1; backdrop-filter: blur(50px); } }
  
  .dash-container { max-width: 1400px; margin: 0 auto; }
  .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 40px 0; }
  
  .kpi-card { 
    background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255,255,255,0.4); padding: 30px; border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.03); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .kpi-value { font-size: 38px; font-weight: 900; color: var(--melilla-blue); margin-bottom: 4px; font-family: 'Playfair Display', serif; }
  .kpi-label { font-size: 11px; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 2px; }

  .chart-section { 
    background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255,255,255,0.6); border-radius: 40px; 
    padding: 40px; margin-bottom: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.04);
  }
  .chart-title { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; color: var(--melilla-blue); }
  
  .strategy-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-bottom: 30px; }

  .bar-row { margin-bottom: 20px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); }
  .bar-track { height: 8px; background: rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--melilla-blue), #5AC8FA); border-radius: 10px; transition: width 1.5s ease-out; width: 0; }
  
  .priority-tag { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
  .priority-high { background: rgba(255, 59, 48, 0.1); color: #FF3B30; }
  .priority-med { background: rgba(255, 149, 0, 0.1); color: #FF9500; }
  .priority-low { background: rgba(52, 199, 89, 0.1); color: #34C759; }

  .modal-overlay { 
    background: rgba(0,0,0,0.4); backdrop-filter: blur(15px); 
    display: none; position: fixed; inset: 0; z-index: 5000; place-items: center; padding: 20px;
  }
  .modal-content {
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(30px);
    border: 1px solid rgba(255,255,255,0.5); border-radius: 40px;
    width: 100%; max-width: 1200px; max-height: 95vh; overflow-y: auto;
    position: relative; padding: 40px; box-shadow: 0 50px 100px rgba(0,0,0,0.1);
  }
  .close-modal { 
    position: absolute; top: 30px; right: 30px; cursor: pointer; 
    width: 40px; height: 40px; background: rgba(0,0,0,0.05); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.3s;
  }
  .close-modal:hover { background: rgba(255, 59, 48, 0.1); color: #FF3B30; }

  .modal-header-mini { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 15px; }
  .modal-title-wrap h2 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--melilla-blue); margin: 0 0 10px 0; line-height: 1.1; }
  .modal-meta { font-size: 11px; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 1.5px; display: flex; gap: 15px; }

  .law-mini-card { 
    background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.08); 
    border-radius: 20px; padding: 25px; margin-bottom: 0px; height: 100%;
  }
  .law-mini-title { font-size: 15px; font-weight: 900; color: var(--melilla-gold); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
  .law-mini-content { font-size: 14px; line-height: 1.6; color: #333; }
  
  .art-pill-label { cursor: pointer; display: block; }
  .art-pill-label input[type="checkbox"] { display: none; }
  .art-pill { background: white; border: 1px solid var(--melilla-blue); color: var(--melilla-blue); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 800; box-shadow: 0 2px 5px rgba(0,122,255,0.08); transition: all 0.2s cubic-bezier(0.1, 0.8, 0.2, 1); }
  .art-pill:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,122,255,0.15); }
  .art-pill-label input[type="checkbox"]:checked + .art-pill { background: var(--melilla-blue); color: white; border-color: var(--melilla-blue); box-shadow: 0 4px 10px rgba(0,122,255,0.3); transform: scale(0.95); }
  .law-breakdown { display: flex; flex-direction: column; gap: 24px; }
  .breakdown-chunk { background: rgba(0,0,0,0.02); border-radius: 16px; padding: 20px; border: 1px solid rgba(0,0,0,0.08); }
  .chunk-desc { font-size: 14px; color: #333; margin-bottom: 16px; line-height: 1.6; }
  .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; }
  
  .close-dash { 
    background: var(--melilla-blue); color: white; border: none; padding: 12px 25px; 
    border-radius: 15px; font-weight: 800; cursor: pointer; transition: all 0.3s ease;
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
  }
  .close-dash:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,122,255,0.3); }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p><span>🏛️</span> Melilla Strategic Hub</p></div>
    <div style="display:flex; gap:12px; align-items:center;">
      <button class="analysis-btn" onclick="toggleDashboard()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        Análisis Legislativo
      </button>
      <button class="edit-btn" id="resetBtn" style="display:none">Restablecer Orden</button>
      <button class="edit-btn" id="editToggle" style="display:none"><span>🔓</span> Editar Orden</button>
      <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
    </div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Busca en el mapa estratégico..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1</button>
      <button class="tab" data-exam="c2">C2</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<div id="analysisDashboard">
  <div class="dash-container">
    <div class="dash-header">
      <div>
        <h2 style="font-family: 'Playfair Display', serif; font-size: 38px; color: var(--melilla-blue); margin:0;">Análisis Legislativo Estratégico</h2>
        <p style="color: var(--text-muted); font-weight: 700; margin-top: 8px; text-transform: uppercase; letter-spacing: 2px; font-size: 12px;">Inteligencia de Datos · Temario C1/C2 Ciudad Autónoma de Melilla</p>
      </div>
      <button class="close-dash" onclick="toggleDashboard()">Cerrar Dashboard</button>
    </div>

    <div class="dash-grid" id="kpiGrid" style="grid-template-columns: repeat(5, 1fr);">
      <!-- KPIs dinámicos -->
    </div>

    <div class="strategy-grid">
      <div class="chart-section" style="grid-column: span 2;">
        <div class="chart-title">🚨 Leyes más Críticas (Top por Artículos)</div>
        <div style="position: relative; height: 350px;">
          <canvas id="topLawsChartCanvas"></canvas>
        </div>
      </div>
      
      <div class="chart-section">
        <div class="chart-title">🎯 Perfil Estratégico por Bloques</div>
        <div style="position: relative; height: 350px; display: flex; justify-content: center;">
          <canvas id="blockRadarCanvas"></canvas>
        </div>
      </div>

      <div class="chart-section">
        <div class="chart-title">⚖️ Mix Normativo</div>
        <div style="position: relative; height: 350px; display: flex; justify-content: center;">
          <canvas id="normativeMixCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="chart-section" style="margin-top: 30px;">
      <div class="chart-title">📈 Inventario Total de Leyes (Prioridad Estratégica)</div>
      <div id="allLawsContainer" style="overflow-y: auto; height: 600px; padding-right: 15px;">
        <div style="position: relative;" id="allLawsInner">
          <canvas id="allLawsChartCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">✕</span>
    <div id="modalBody"></div>
  </div>
</div>

function getInitialGrouping() {
  const saved = localStorage.getItem('userGrouping');
  if (saved) return JSON.parse(saved);
  const mapping = {};
  ALL_DATA.forEach(item => {
    const block = BLOCKS.find(b => {
      const isC1 = item.exam === 'c1';
      const r = isC1 ? b.defaultRange.c1 : b.defaultRange.c2;
      const n = item.num;
      for(let i=0; i<r.length; i+=2) {
        if(typeof r[i] === 'number') {
          const val = parseInt(n.replace(/\D/g, ''));
          if(val >= r[i] && val <= r[i+1]) return true;
        } else {
          if(n === r[i] || (n >= r[i] && n <= r[i+1])) return true;
        }
      }
      return false;
    });
    mapping[item.id] = block ? block.id : 'b-admin';
  });
  return mapping;
}

function parseArts(text) {
  const parts = text.split(/\s\+\s/);
  return `<div class="law-breakdown">${parts.map(p => {
    const regex = /(?:art[s]?\.?|artículo[s]?)\s*(\d+)(?:\s*[–-]\s*(\d+))?(?:\s+(bis|ter|quater))?/gi;
    let articles = new Set();
    let match;
    while ((match = regex.exec(p)) !== null) {
      let start = parseInt(match[1]);
      let end = match[2] ? parseInt(match[2]) : start;
      let suffix = match[3] ? ' ' + match[3] : '';
      if (end >= start && (end - start) < 1000) { 
         for(let i=start; i<=end; i++) {
           articles.add(i + (start === end ? suffix : ''));
         }
      }
    }
    let artsArray = Array.from(articles).sort((a,b) => parseInt(a) - parseInt(b));
    let descText = p.replace(/(Título\s+[IVXLC]+|Capítulo\s+[IVXLC]+)/gi, '<strong style="color:var(--melilla-blue)">$1</strong>');
    return `
      <div class="breakdown-chunk">
        <div class="chunk-desc">${descText}</div>
        ${artsArray.length > 0 ? `
          <div class="article-grid">
            ${artsArray.map(a => `
              <label class="art-pill-label">
                <input type="checkbox">
                <div class="art-pill">Art. ${a}</div>
              </label>
            `).join('')}
          </div>
        ` : `<div style="font-size:11px; font-weight: 800; color: var(--melilla-gold); text-transform: uppercase;">Íntegra / Sin desglose numérico</div>`}
      </div>
    `;
  }).join('')}</div>`;
}

function render() {
  const container = document.getElementById('content');
  const filtered = ALL_DATA.filter(d => (state.exam === 'all' || d.exam === state.exam) && (d.titulo + d.enunciado + d.num).toLowerCase().includes(state.q.toLowerCase()));
  const grouped = BLOCKS.map(b => {
    let items = filtered.filter(item => state.userGrouping[item.id] === b.id);
    items.sort((a, b) => {
      const na = parseInt(a.num.replace(/\D/g, ''));
      const nb = parseInt(b.num.replace(/\D/g, ''));
      if (na !== nb) return na - nb;
      return a.exam.localeCompare(b.exam);
    });
    const general = items.filter(i => i.num.startsWith('T'));
    const especifica = items.filter(i => i.num.startsWith('E'));
    return { ...b, general, especifica, hasItems: items.length > 0 };
  }).filter(b => b.hasItems || state.editMode);

  container.innerHTML = grouped.map(block => {
    const renderGrid = (items) => `
      <div class="grid">
        ${items.map(item => `
          <article class="card" 
                   draggable="${state.editMode}" 
                   ondragstart="handleDragStart(event, '${item.id}')"
                   ondragend="handleDragEnd(event)"
                   onclick="${state.editMode ? '' : `openModal('${item.id}')`}">
            <div class="card-num" style="color:${block.accent}">${item.num} · NÚCLEO</div>
            <h2 class="card-title">${item.titulo}</h2>
            ${state.editMode ? `
              <select class="block-select" onchange="moveItem('${item.id}', this.value)" onclick="event.stopPropagation()">
                ${BLOCKS.map(b => `<option value="${b.id}" ${b.id === block.id ? 'selected' : ''}>Mover a ${b.name}</option>`).join('')}
              </select>
            ` : ''}
            <div style="margin-top:auto; font-size:11px; font-weight:800; opacity:0.6;">${item.examName}</div>
          </article>
        `).join('')}
      </div>
    `;
    return `
      <div class="block-container ${state.openBlocks.has(block.id) ? 'open' : ''}" 
           id="${block.id}"
           ondragover="handleDragOver(event, '${block.id}')" 
           ondragleave="handleDragLeave(event, '${block.id}')"
           ondrop="handleDrop(event, '${block.id}')">
        <div class="block-header" onclick="toggleBlock('${block.id}')">
          <div class="icon-wrap">
            ${block.icon}
            <h3 style="color:${block.accent}">${block.name}</h3>
          </div>
          <span style="font-size: 11px; font-weight: 900; opacity: 0.5; letter-spacing:1px; color:var(--text)">${state.openBlocks.has(block.id) ? 'CERRAR' : 'ABRIR'}</span>
        </div>
        <div class="block-content" style="${state.openBlocks.has(block.id) ? 'display:block' : 'display:none'}">
          ${block.general.length > 0 ? `<div class="sub-header" style="color:${block.accent}">Parte General</div>${renderGrid(block.general)}` : ''}
          ${block.especifica.length > 0 ? `<div class="sub-header" style="color:${block.accent}">Parte Específica</div>${renderGrid(block.especifica)}` : ''}
          ${state.editMode && block.general.length === 0 && block.especifica.length === 0 ? `<div class="grid"><div style="grid-column: 1/-1; padding:40px; text-align:center; opacity:0.3; border: 2px dashed var(--line); border-radius:32px;">Suelta un tema aquí</div></div>` : ''}
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('resetBtn').style.display = state.editMode ? 'block' : 'none';
}

window.handleDragStart = (e, id) => { e.dataTransfer.setData('text/plain', id); e.currentTarget.classList.add('dragging'); };
window.handleDragEnd = (e) => { e.currentTarget.classList.remove('dragging'); };
window.handleDragOver = (e, blockId) => { if (!state.editMode) return; e.preventDefault(); document.getElementById(blockId).classList.add('drag-over'); };
window.handleDragLeave = (e, blockId) => { document.getElementById(blockId).classList.remove('drag-over'); };
window.handleDrop = (e, blockId) => { if (!state.editMode) return; e.preventDefault(); document.getElementById(blockId).classList.remove('drag-over'); const itemId = e.dataTransfer.getData('text/plain'); moveItem(itemId, blockId); };
window.moveItem = (itemId, blockId) => { state.userGrouping[itemId] = blockId; localStorage.setItem('userGrouping', JSON.stringify(state.userGrouping)); render(); if (document.getElementById('modal').style.display === 'grid') { openModal(itemId); } };

function calculateStats() {
  const allThemes = ALL_DATA;
  const lawCounts = {};
  const typeCounts = { 'Leyes Orgánicas': 0, 'Reales Decretos Legislativos': 0, 'Leyes Ordinarias': 0, 'Reglamentos/Otros': 0 };
  let totalArticles = 0;
  const lawArticleCounts = {};
  const blockArticleCounts = {};
  BLOCKS.forEach(b => blockArticleCounts[b.id] = { name: b.name, articles: 0 });
  allThemes.forEach(theme => {
    const blockId = state.userGrouping[theme.id];
    theme.leyes.forEach(law => {
      const name = law.n;
      lawCounts[name] = (lawCounts[name] || 0) + 1;
      if (name.includes('Orgánica')) typeCounts['Leyes Orgánicas']++;
      else if (name.includes('Real Decreto Legislativo')) typeCounts['Reales Decretos Legislativos']++;
      else if (name.includes('Ley')) typeCounts['Leyes Ordinarias']++;
      else typeCounts['Reglamentos/Otros']++;
      const matches = law.arts.match(/\d+/g);
      const articleCount = matches ? matches.length : 0;
      totalArticles += articleCount;
      lawArticleCounts[name] = (lawArticleCounts[name] || 0) + articleCount;
      if(blockId && blockArticleCounts[blockId]) blockArticleCounts[blockId].articles += articleCount;
    });
  });
  const estimatedHours = Math.round((totalArticles * 5) / 60);
  const uniqueLaws = Object.keys(lawCounts).length;
  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card"><div class="kpi-value">${allThemes.length}</div><div class="kpi-label">Temas</div></div>
    <div class="kpi-card"><div class="kpi-value">${uniqueLaws}</div><div class="kpi-label">Normas</div></div>
    <div class="kpi-card"><div class="kpi-value">${totalArticles}</div><div class="kpi-label">Artículos</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color: #FF3B30">~${estimatedHours}h</div><div class="kpi-label">Estudio</div></div>
    <div class="kpi-card" style="background: rgba(0, 122, 255, 0.05); border-color: rgba(0, 122, 255, 0.3);">
      <div style="font-size: 14px; font-weight: 900; color: var(--melilla-blue); margin-bottom: 5px;">🎯 ESTRATEGIA</div>
      <div style="font-size: 11px; line-height: 1.4; font-weight: 600; color: #555;">Prioriza <b>${Object.entries(lawArticleCounts).sort((a,b) => b[1]-a[1])[0][0].substring(0,25)}...</b></div>
    </div>
  `;
  Object.values(charts).forEach(chart => chart.destroy());
  charts = {};
  const topLaws = Object.entries(lawArticleCounts).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const topLawsCtx = document.getElementById('topLawsChartCanvas').getContext('2d');
  charts.topLaws = new Chart(topLawsCtx, { type: 'bar', data: { labels: topLaws.map(l => l[0].substring(0,30)+'...'), datasets: [{ label: 'Artículos', data: topLaws.map(l => l[1]), backgroundColor: 'rgba(0, 122, 255, 0.7)', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } } } });
  const radarCtx = document.getElementById('blockRadarCanvas').getContext('2d');
  charts.radar = new Chart(radarCtx, { type: 'radar', data: { labels: Object.values(blockArticleCounts).map(b => b.name), datasets: [{ label: 'Artículos', data: Object.values(blockArticleCounts).map(b => b.articles), backgroundColor: 'rgba(255, 215, 0, 0.4)', borderColor: 'rgba(255, 215, 0, 1)' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { r: { ticks: { display: false } } }, plugins: { legend: { display: false } } } });
  const mixCtx = document.getElementById('normativeMixCanvas').getContext('2d');
  charts.mix = new Chart(mixCtx, { type: 'doughnut', data: { labels: Object.keys(typeCounts), datasets: [{ data: Object.values(typeCounts), backgroundColor: ['#FF3B30', '#FF9500', '#007AFF', '#34C759'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } } });
  const allLaws = Object.entries(lawArticleCounts).sort((a,b) => b[1] - a[1]);
  const allLawsInner = document.getElementById('allLawsInner');
  if (allLawsInner) {
    allLawsInner.style.height = (allLaws.length * 35) + 'px';
    const allLawsCtx = document.getElementById('allLawsChartCanvas').getContext('2d');
    charts.allLaws = new Chart(allLawsCtx, { type: 'bar', data: { labels: allLaws.map(l => l[0].substring(0,50)+'...'), datasets: [{ label: 'Artículos', data: allLaws.map(l => l[1]), backgroundColor: 'rgba(0, 122, 255, 0.5)', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } } } });
  }
}
setUI(); render();
</script>
</body></html>
