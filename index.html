<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Mapa Normativo Detallado</title>
<style>
:root[data-theme="dark"] {
  --bg: #05070a;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --accent: #00a2ff;
  --gold: #ffcc00;
  --liquid-1: rgba(0, 162, 255, 0.2);
  --liquid-2: rgba(255, 204, 0, 0.15);
  --shadow: 0 20px 50px rgba(0,0,0,0.5);
}

:root[data-theme="light"] {
  --bg: #f5f7fa;
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: rgba(255, 255, 255, 0.9);
  --line: rgba(0, 0, 0, 0.05);
  --text: #1d1d1f;
  --text-muted: rgba(0, 0, 0, 0.5);
  --accent: #0071e3;
  --gold: #bf8f00;
  --liquid-1: rgba(0, 113, 227, 0.1);
  --liquid-2: rgba(255, 149, 0, 0.1);
  --shadow: 0 20px 40px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; transition: background-color 0.4s, color 0.4s, border-color 0.4s; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.liquid { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; animation: drift 20s infinite alternate; }
.l1 { width: 600px; height: 600px; background: var(--liquid-1); top: -200px; left: -100px; }
.l2 { width: 500px; height: 500px; background: var(--liquid-2); bottom: -100px; right: -100px; animation-delay: -5s; }

@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px, 30px) scale(1.1); } }

.app { max-width: 1400px; margin: auto; padding: 40px 24px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
.brand h1 { font-size: 38px; letter-spacing: -1.5px; margin: 0; font-weight: 800; }
.brand p { color: var(--text-muted); margin: 6px 0 0; font-size: 16px; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 6px; border-radius: 12px; cursor: pointer; display: flex; gap: 4px; backdrop-filter: blur(10px); }
.toggle span { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.toggle .active { background: var(--accent); color: white; }

.nav-bar { display: flex; gap: 16px; margin-bottom: 40px; align-items: center; position: sticky; top: 15px; z-index: 100; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 12px 18px; border-radius: 16px; backdrop-filter: blur(25px); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 16px; outline: none; }
.filter-tabs { display: flex; background: var(--surface); padding: 5px; border-radius: 16px; border: 1px solid var(--line); backdrop-filter: blur(25px); }
.tab { border: none; background: none; color: var(--text-muted); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.tab.active { background: var(--surface-hover); color: var(--text); }

/* Blocks */
.block-group { margin-bottom: 50px; }
.block-header { 
  font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 20px; display: flex; align-items: center; gap: 10px; opacity: 0.8;
}
.block-header::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 24px;
  backdrop-filter: blur(30px) saturate(180%); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 16px; position: relative;
}
.card:hover { border-color: var(--accent); transform: translateY(-3px); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card-num { font-size: 12px; font-weight: 900; color: var(--gold); background: rgba(255, 204, 0, 0.1); padding: 4px 8px; border-radius: 6px; }
.badge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--text-muted); }

.card-title { font-size: 17px; font-weight: 750; line-height: 1.35; margin: 0; color: var(--text); }

.law-section { display: flex; flex-direction: column; gap: 10px; }
.law-item { background: rgba(0,0,0,0.15); padding: 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); }
.law-name { font-size: 12px; color: var(--accent); font-weight: 800; text-decoration: none; display: block; margin-bottom: 6px; }
.law-name:hover { text-decoration: underline; }
.law-arts { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.85); }

[data-theme="light"] .law-item { background: rgba(255,255,255,0.5); }
[data-theme="light"] .law-arts { color: #333; }

.prog-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.prog-select { background: var(--surface-hover); border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; outline: none; cursor: pointer; }

@media (max-width: 768px) {
  header { flex-direction: column; gap: 20px; }
  .nav-bar { flex-direction: column; position: static; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p>Mapa Normativo Detallado — C1 / C2</p></div>
    <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Busca por tema, ley o artículo..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">Administrativo C1</button>
      <button class="tab" data-exam="c2">Auxiliar C2</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<script>
const LAW_URLS = {
  'Constitución': 'https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229',
  'Ley 39/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565',
  'Ley 40/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566',
  'TREBEP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719',
  'LCSP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902',
  'Estatuto': 'https://www.boe.es/buscar/act.php?id=BOE-A-1995-6544',
  'TRLRHL': 'https://www.boe.es/buscar/act.php?id=BOE-A-2004-4244',
  'LRBRL': 'https://www.boe.es/buscar/act.php?id=BOE-A-1985-5392',
  'LO 3/2007': 'https://www.boe.es/buscar/act.php?id=BOE-A-2007-6115',
  'LO 3/1981': 'https://www.boe.es/buscar/act.php?id=BOE-A-1981-10325'
};

const C1 = [
  {parte:"Parte general",num:"T1",enunciado:"La Constitución Española de 1978: características, estructura y Título Preliminar. La Reforma Constitucional. Título I: De los derechos y deberes fundamentales. Título II: De la Corona.",leyes:[{n:"Constitución Española de 1978",arts:"Preámbulo + arts. 1–9 (Título Preliminar) + arts. 10–55 (Título I: Capítulos I al V) + arts. 56–65 (Título II) + arts. 166–169 (Título X)"}]},
  {parte:"Parte general",num:"T2",enunciado:"La CE 1978: Título III De las Cortes Generales. Título IV del Gobierno y de la Administración. Título V De las relaciones entre el Gobierno y las Cortes Generales.",leyes:[{n:"Constitución Española de 1978",arts:"Arts. 66–96 (Título III) + arts. 97–107 (Título IV) + arts. 108–116 (Título V)"}]},
  {parte:"Parte general",num:"T3",enunciado:"La CE 1978: Título VI del Poder Judicial. El CGPJ: composición y funcionamiento en la LO 6/1985.",leyes:[{n:"Constitución Española de 1978",arts:"Arts. 117–127 (Título VI)"},{n:"LO 6/1985 (LOPJ)",arts:"Arts. 558–642"}]},
  {parte:"Parte general",num:"T4",enunciado:"Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo.",leyes:[{n:"LO 3/1981 del Defensor del Pueblo",arts:"Arts. 1–37"}]},
  {parte:"Parte general",num:"T5",enunciado:"Fuentes del Derecho Público. La ley: clases de leyes. El reglamento: concepto y clases.",leyes:[{n:"Constitución Española",arts:"Arts. 81–82, 86, 97"},{n:"Ley 39/2015",arts:"Arts. 127–133"},{n:"Ley 40/2015",arts:"Arts. 128–133"}]},
  {parte:"Parte general",num:"T6",enunciado:"Ley Orgánica 2/1995: Estatuto de Autonomía de Melilla.",leyes:[{n:"LO 2/1995 Estatuto de Melilla",arts:"Arts. 1–41 + Disposiciones"}]},
  {parte:"Parte general",num:"T7",enunciado:"Régimen local español: principios, entidades, Municipio, población, organización y competencias.",leyes:[{n:"Constitución Española",arts:"Arts. 137–142"},{n:"Ley 7/1985 (LRBRL)",arts:"Arts. 1–28"}]},
  {parte:"Parte general",num:"T8",enunciado:"LO 3/2007 para la igualdad efectiva de mujeres y hombres.",leyes:[{n:"LO 3/2007 Igualdad",arts:"Arts. 1–13, 53"}]},
  {parte:"Parte específica",num:"T9",enunciado:"Potestad organizatoria: órganos administrativos, competencia, técnicas de traslación, órganos colegiados.",leyes:[{n:"Ley 40/2015",arts:"Arts. 5–22"}]},
  {parte:"Parte específica",num:"T10",enunciado:"Personas ante la Administración: derechos y obligaciones. El interesado: concepto, capacidad y representación.",leyes:[{n:"Ley 39/2015",arts:"Arts. 3–12, 53"}]},
  {parte:"Parte específica",num:"T11",enunciado:"El acto administrativo. Concepto. Elementos. Clases.",leyes:[{n:"Ley 39/2015",arts:"Arts. 34–36"},{n:"Ley 40/2015",arts:"Arts. 1–4"}]},
  {parte:"Parte específica",num:"T12",enunciado:"La notificación: contenido, plazo y práctica. Publicación. Eficacia.",leyes:[{n:"Ley 39/2015",arts:"Arts. 37–46"}]},
  {parte:"Parte específica",num:"T13",enunciado:"Invalidez del acto: nulidad y anulabilidad. Revisión de oficio. Revocación.",leyes:[{n:"Ley 39/2015",arts:"Arts. 47–52, 106–111"}]},
  {parte:"Parte específica",num:"T14",enunciado:"Actuación de AAPP: registro, archivo, colaboración. Términos y plazos.",leyes:[{n:"Ley 39/2015",arts:"Arts. 13–33"}]},
  {parte:"Parte específica",num:"T15",enunciado:"Fases del procedimiento: iniciación, ordenación, instrucción y terminación.",leyes:[{n:"Ley 39/2015",arts:"Arts. 54–95"}]},
  {parte:"Parte específica",num:"T16",enunciado:"Obligación de resolver. Silencio administrativo.",leyes:[{n:"Ley 39/2015",arts:"Arts. 21–26"}]},
  {parte:"Parte específica",num:"T17",enunciado:"Recursos administrativos. Ejecución forzosa.",leyes:[{n:"Ley 39/2015",arts:"Arts. 112–126, 97–105"}]},
  {parte:"Parte específica",num:"T18",enunciado:"Potestad sancionadora: principios y especialidades.",leyes:[{n:"Ley 40/2015",arts:"Arts. 25–31"},{n:"Ley 39/2015",arts:"Arts. 63–69"}]},
  {parte:"Parte específica",num:"T19",enunciado:"Contratos del sector público: objeto, ámbito y tipos. SARA.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Arts. 1–27"}]},
  {parte:"Parte específica",num:"T20",enunciado:"Disposiciones generales de contratación: perfección y forma.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Arts. 28–43"}]},
  {parte:"Parte específica",num:"T21",enunciado:"Partes en los contratos: órganos, capacidad y solvencia.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Arts. 61–98, 316–322"}]},
  {parte:"Parte específica",num:"T22",enunciado:"Objeto, precio y garantías. Preparación: expediente y pliegos.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Arts. 99–130"}]},
  {parte:"Parte específica",num:"T23",enunciado:"Adjudicación de contratos: normas y procedimientos.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Arts. 131–187"}]},
  {parte:"Parte específica",num:"T24",enunciado:"Efectos, prerrogativas y ejecución de contratos.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Arts. 188–213"}]},
  {parte:"Parte específica",num:"T25",enunciado:"Los contratos menores. Límites e instrucciones OIReScon.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Art. 118, 332"}]},
  {parte:"Parte específica",num:"T26",enunciado:"Actividad subvencional: tipos y procedimientos.",leyes:[{n:"Ley 38/2003 Subvenciones",arts:"Arts. 1–43"}]},
  {parte:"Parte específica",num:"T27",enunciado:"Responsabilidad patrimonial: principios y procedimiento.",leyes:[{n:"Ley 40/2015",arts:"Arts. 32–37"},{n:"Ley 39/2015",arts:"Arts. 61, 65, 81, 91"}]},
  {parte:"Parte específica",num:"T28",enunciado:"Empleados públicos: clases, acceso y extinción.",leyes:[{n:"RDL 5/2015 (TREBEP)",arts:"Arts. 1–13, 55–68"}]},
  {parte:"Parte específica",num:"T29",enunciado:"Provisión de puestos y situaciones administrativas.",leyes:[{n:"RDL 5/2015 (TREBEP)",arts:"Arts. 78–92"}]},
  {parte:"Parte específica",num:"T30",enunciado:"Derechos individuales y colectivos. Negociación colectiva.",leyes:[{n:"RDL 5/2015 (TREBEP)",arts:"Arts. 14–15, 31–46"}]},
  {parte:"Parte específica",num:"T31",enunciado:"Deberes y régimen disciplinario. Incompatibilidades.",leyes:[{n:"RDL 5/2015 (TREBEP)",arts:"Arts. 52–54, 93–98"},{n:"Ley 53/1984",arts:"Íntegra"}]},
  {parte:"Parte específica",num:"T32",enunciado:"Intervención administrativa local. Licencias.",leyes:[{n:"Ley 7/1985",arts:"Art. 84"},{n:"Reglamento Servicios Corporaciones Locales",arts:"Arts. 1–22"}]},
  {parte:"Parte específica",num:"T33",enunciado:"El Presidente de Melilla. Naturaleza y atribuciones.",leyes:[{n:"Estatuto Melilla",arts:"Arts. 14–15"}]},
  {parte:"Parte específica",num:"T34",enunciado:"El Consejo de Gobierno de Melilla. Consejeros.",leyes:[{n:"Estatuto Melilla",arts:"Arts. 16–19"}]},
  {parte:"Parte específica",num:"T35",enunciado:"La Asamblea de Melilla. Comisiones y atribuciones.",leyes:[{n:"Estatuto Melilla",arts:"Arts. 6–13"}]},
  {parte:"Parte específica",num:"T36",enunciado:"Administración de Melilla. Función directiva.",leyes:[{n:"Estatuto Melilla",arts:"Art. 28"}]},
  {parte:"Parte específica",num:"T37",enunciado:"Patrimonio local: bienes, dominio público y patrimoniales.",leyes:[{n:"Ley 7/1985",arts:"Arts. 79–83"},{n:"Reglamento Bienes Entidades Locales",arts:"Íntegro"}]},
  {parte:"Parte específica",num:"T38",enunciado:"Presupuesto local: elaboración, aprobación y prórroga.",leyes:[{n:"RDL 2/2004 (TRLRHL)",arts:"Arts. 162–169"}]},
  {parte:"Parte específica",num:"T39",enunciado:"Estructura presupuestaria y créditos. Modificaciones.",leyes:[{n:"RDL 2/2004 (TRLRHL)",arts:"Arts. 167, 172–182"}]},
  {parte:"Parte específica",num:"T40",enunciado:"Ejecución del presupuesto: fases y pagos a justificar.",leyes:[{n:"RDL 2/2004 (TRLRHL)",arts:"Arts. 183–193"}]},
  {parte:"Parte específica",num:"T41",enunciado:"Control interno en el Sector Público Local.",leyes:[{n:"RDL 2/2004 (TRLRHL)",arts:"Arts. 213–222"},{n:"RD 424/2017",arts:"Íntegro"}]},
  {parte:"Parte específica",num:"T42",enunciado:"Tasas, precios públicos y contribuciones especiales.",leyes:[{n:"RDL 2/2004 (TRLRHL)",arts:"Arts. 20–47"}]}
];

const C2 = [
  {parte:"Parte general",num:"T1",enunciado:"Constitución Española: características, estructura y Título Preliminar.",leyes:[{n:"Constitución Española",arts:"Arts. 1–9"}]},
  {parte:"Parte general",num:"T2",enunciado:"Constitución Española: Título I Derechos y Deberes.",leyes:[{n:"Constitución Española",arts:"Arts. 10–55"}]},
  {parte:"Parte general",num:"T7",enunciado:"Constitución Española: Organización territorial. Acceso a autonomía de Melilla.",leyes:[{n:"Constitución Española",arts:"Arts. 137–158"},{n:"Estatuto Melilla",arts:"Art. 1"}]},
  {parte:"Parte específica",num:"E1",enunciado:"Ley 39/2015: objeto, capacidad, interesado, plazos.",leyes:[{n:"Ley 39/2015",arts:"Arts. 1–33"}]},
  {parte:"Parte específica",num:"E2",enunciado:"El acto administrativo: concepto, eficacia y requisitos.",leyes:[{n:"Ley 39/2015",arts:"Arts. 34–46"}]},
  {parte:"Parte específica",num:"E13",enunciado:"Los contratos menores: límites y adjudicación.",leyes:[{n:"Ley 9/2017 (LCSP)",arts:"Art. 118, 332"}]}
];

// Combine all with metadata
const ALL_DATA = [
  ...C1.map(x => ({...x, exam:'c1', examName:'Administrativo C1'})),
  ...C2.map(x => ({...x, exam:'c2', examName:'Auxiliar C2'}))
];

const BLOCKS = [
  { id: 'gen', name: 'Bloque I: Organización del Estado y Melilla (Parte General)' },
  { id: 'adm', name: 'Bloque II: Derecho Administrativo y Procedimiento (Parte Específica)' },
  { id: 'con', name: 'Bloque III: Contratación y Función Pública' },
  { id: 'hac', name: 'Bloque IV: Haciendas Locales y Organización CAM' }
];

function getBloque(item) {
  if (item.parte === "Parte general") return 'gen';
  const n = parseInt(item.num.substring(1));
  if (item.exam === 'c1') {
    if (n >= 9 && n <= 18) return 'adm';
    if (n >= 19 && n <= 32) return 'con';
    return 'hac';
  }
  return 'adm';
}

let state = {
  theme: localStorage.getItem('theme') || 'dark',
  exam: 'all',
  q: '',
  progress: JSON.parse(localStorage.getItem('progress') || '{}')
};

function render() {
  const container = document.getElementById('content');
  const filtered = ALL_DATA.filter(d => {
    const matchExam = state.exam === 'all' || d.exam === state.exam;
    const txt = (d.enunciado + d.num + d.num + d.parte).toLowerCase();
    const matchSearch = txt.includes(state.q.toLowerCase());
    return matchExam && matchSearch;
  });

  const grouped = BLOCKS.map(b => ({
    ...b,
    items: filtered.filter(item => getBloque(item) === b.id)
  })).filter(b => b.items.length > 0);

  container.innerHTML = grouped.map(block => `
    <section class="block-group">
      <div class="block-header">${block.name}</div>
      <div class="grid">
        ${block.items.map(item => {
          const prog = state.progress[item.id] || 'Pendiente';
          return `
            <article class="card">
              <div class="card-top">
                <span class="card-num">${item.num} · ${item.exam.toUpperCase()}</span>
                <span class="badge">${item.parte}</span>
              </div>
              <h2 class="card-title">${item.enunciado}</h2>
              <div class="law-section">
                ${item.leyes.map(l => `
                  <div class="law-item">
                    <a href="${LAW_URLS[Object.keys(LAW_URLS).find(k => l.n.includes(k))] || '#'}" class="law-name" target="_blank">${l.n} ↗</a>
                    <div class="law-arts">${l.arts}</div>
                  </div>
                `).join('')}
              </div>
              <div class="prog-footer">
                <select class="prog-select" onchange="updateProg('${item.id}', this.value)">
                  <option value="Pendiente" ${prog === 'Pendiente' ? 'selected' : ''}>⭕ Pendiente</option>
                  <option value="Leído" ${prog === 'Leído' ? 'selected' : ''}>🔷 Leído / Resumido</option>
                  <option value="Dominado" ${prog === 'Dominado' ? 'selected' : ''}>✅ Dominado</option>
                </select>
              </div>
            </article>
          `;
        }).join('')}
      </div>
    </section>
  `).join('');
}

window.updateProg = (id, val) => {
  state.progress[id] = val;
  localStorage.setItem('progress', JSON.stringify(state.progress));
  render();
};

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => {
    s.classList.toggle('active', s.dataset.v === state.theme);
  });
}

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => {
  state.q = e.target.value;
  render();
};

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

setUI();
render();
</script>
</body></html>
