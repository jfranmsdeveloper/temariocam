<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Melilla Strategic Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --melilla-blue: #005BBF;
  --melilla-gold: #FFD700;
  --bg: #030509;
  --surface: rgba(255, 255, 255, 0.03);
  --surface-hover: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.5);
  --accent: var(--melilla-blue);
  --glass-blur: blur(60px);
}

:root[data-theme="light"] {
  --melilla-blue: #0076F5;
  --melilla-gold: #D4AF37;
  --bg: #F0F4F8;
  --surface: rgba(255, 255, 255, 0.6);
  --surface-hover: rgba(255, 255, 255, 0.85);
  --line: rgba(0, 0, 0, 0.04);
  --text: #0A1128;
  --text-muted: #546E7A;
  --accent: var(--melilla-blue);
  --glass-blur: blur(40px);
}

* { box-sizing: border-box; transition: all 0.5s cubic-bezier(0.1, 0.8, 0.2, 1); }
body {
  margin: 0; min-height: 100vh; font-family: 'Inter', sans-serif;
  background-color: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased;
}

/* Liquid Blobs - Melilla Style */
.liquid { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; pointer-events: none; opacity: 0.4; animation: drift 25s infinite alternate; }
.l1 { width: 800px; height: 800px; background: radial-gradient(circle, var(--melilla-blue) 0%, transparent 70%); top: -300px; left: -200px; }
.l2 { width: 600px; height: 600px; background: radial-gradient(circle, var(--melilla-gold) 0%, transparent 70%); bottom: -200px; right: -200px; animation-delay: -10s; }

@keyframes drift { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(100px, 50px) rotate(30deg); } }

.app { max-width: 1400px; margin: auto; padding: 60px 24px; }

header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
.brand h1 { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 900; margin: 0; letter-spacing: -3px; color: var(--melilla-blue); text-shadow: 0 10px 30px rgba(0,91,191,0.2); }
.brand p { color: var(--text-muted); margin: 8px 0 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 16px; cursor: pointer; display: flex; backdrop-filter: var(--glass-blur); }
.toggle span { padding: 6px 16px; border-radius: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
.toggle .active { background: var(--melilla-blue); color: white; box-shadow: 0 5px 15px rgba(0,91,191,0.3); }

.nav-bar { display: flex; gap: 20px; margin-bottom: 50px; position: sticky; top: 30px; z-index: 1000; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 18px 24px; border-radius: 24px; backdrop-filter: var(--glass-blur); border-bottom: 2px solid rgba(255,255,255,0.05); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 18px; outline: none; font-weight: 600; }

.filter-tabs { display: flex; background: var(--surface); padding: 4px; border-radius: 20px; border: 1px solid var(--line); backdrop-filter: var(--glass-blur); }
.tab { border: none; background: none; color: var(--text-muted); padding: 10px 24px; border-radius: 16px; cursor: pointer; font-weight: 800; font-size: 14px; }
.tab.active { background: var(--surface-hover); color: var(--accent); border: 1px solid var(--line); }

/* Collapsible Blocks - Liquid Apple Style */
.block-container { margin-bottom: 30px; border: 1px solid var(--line); border-radius: 40px; background: var(--surface); backdrop-filter: var(--glass-blur); overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.2); }
.block-header { padding: 35px 45px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.block-header h3 { margin: 0; font-family: 'Playfair Display', serif; font-size: 26px; color: var(--melilla-gold); }
.block-header .icon-wrap { display: flex; align-items: center; gap: 15px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 24px; padding: 45px; border-top: 1px solid var(--line); }

.card {
  background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 32px; padding: 35px;
  display: flex; flex-direction: column; gap: 20px; cursor: pointer; position: relative;
}
.card:hover { transform: scale(1.02) translateY(-10px); border-color: var(--melilla-blue); background: rgba(0,91,191,0.05); }
.card-num { font-size: 14px; font-weight: 900; color: var(--melilla-gold); letter-spacing: 2px; }
.card-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin: 0; line-height: 1.25; }

/* Modal - Ultimate Liquid Glass */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(25px); z-index: 2000; display: none; place-items: center; padding: 24px; }
.modal-content {
  background: var(--bg); border: 1px solid var(--line); border-radius: 50px;
  width: 100%; max-width: 1100px; max-height: 90vh; overflow-y: auto;
  position: relative; padding: 80px; box-shadow: 0 100px 200px rgba(0,0,0,0.8);
}
.close-modal { position: absolute; top: 40px; right: 40px; cursor: pointer; opacity: 0.4; font-size: 30px; }

.modal-header h2 { font-family: 'Playfair Display', serif; font-size: 48px; color: var(--melilla-blue); margin: 20px 0; letter-spacing: -2px; }

.law-block { margin-bottom: 50px; border-left: 6px solid var(--melilla-blue); padding-left: 40px; }
.law-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--melilla-gold); margin-bottom: 30px; }

.outline-list { list-style: none; padding: 0; }
.outline-item { margin-bottom: 25px; padding-left: 35px; position: relative; font-size: 18px; line-height: 1.6; }
.outline-item::before { content: "⚖️"; position: absolute; left: 0; top: 4px; font-size: 20px; }

.sub-list { list-style: none; padding-left: 20px; margin-top: 15px; }
.sub-item { font-size: 16px; color: var(--text-muted); margin-bottom: 12px; position: relative; padding-left: 20px; }
.sub-item::before { content: "🖋️"; position: absolute; left: 0; opacity: 0.5; }

@media (max-width: 1024px) {
  .modal-content { padding: 40px; border-radius: 40px; }
  .modal-header h2 { font-size: 32px; }
  .grid { grid-template-columns: 1fr; padding: 24px; }
}
</style>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p><span>🏛️</span> Melilla Strategic Hub</p></div>
    <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Buscar en el mapa estratégico..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1 Administrativo</button>
      <button class="tab" data-exam="c2">C2 Auxiliar</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">✕</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// Base de datos completa
const C1 = [
{parte:"Parte general",num:"T1",enunciado:"La Constitución Española de 1978: características, estructura y Título Preliminar. La Reforma Constitucional. Título I: De los derechos y deberes fundamentales. Título II: De la Corona.",leyes:[
  {n:"Constitución Española de 1978",arts:"Preámbulo + arts. 1–9 (Título Preliminar) + arts. 10–55 (Título I: Capítulos I al V, incluyendo derechos fundamentales arts. 15–29, derechos y deberes arts. 30–38, principios rectores arts. 39–52, garantías arts. 53–54 y suspensión art. 55) + arts. 56–65 (Título II: La Corona) + arts. 166–169 (Título X: Reforma constitucional)"}
]},
{parte:"Parte general",num:"T2",enunciado:"La CE 1978: Título III De las Cortes Generales. Título IV del Gobierno y de la Administración. Título V De las relaciones entre el Gobierno y las Cortes Generales.",leyes:[
  {n:"Constitución Española de 1978",arts:"Arts. 66–96 (Título III: Cortes Generales — Cámaras, elaboración de leyes y Tratados Internacionales) + arts. 97–107 (Título IV: Gobierno y Administración) + arts. 108–116 (Título V: Relaciones Gobierno–Cortes)"}
]},
{parte:"Parte general",num:"T6",enunciado:"Ley Orgánica 2/1995, de 13 de marzo, sobre el Estatuto de Autonomía de la Ciudad Autónoma de Melilla.",leyes:[
  {n:"LO 2/1995, de 13 de marzo, Estatuto de Autonomía de Melilla (EAM)",arts:"Íntegra: arts. 1–4 (Título Preliminar) + arts. 5–19 (Título I: organización institucional — Asamblea, Presidente, Consejo de Gobierno) + arts. 20–27 (Título II: competencias, incluido art. 21.1 con las 25 materias) + arts. 28–32 (Título III: régimen jurídico) + art. 33 (Título IV: cooperación con el Estado) + arts. 34–40 (Título V: régimen económico y financiero) + art. 41 (Título VI: reforma)"}
]},
{parte:"Parte específica",num:"T19",enunciado:"Contratos del sector público: objeto y ámbito de la LCSP. Tipos de contratos. Contratos sujetos a regulación armonizada.",leyes:[
  {n:"Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público (LCSP)",arts:"Arts. 1–11 (Objeto y ámbito) + arts. 12–18 (Tipos de contratos) + arts. 19–23 (SARA: umbrales obras 5.538.000 €, servicios 221.000 €) + arts. 24–27 (Administrativos y privados)"}
]}
];

// Add the rest of themes...
const BLOCKS = [
  { id: 'b1', name: 'Bloque I: El Estado y la Constitución', range: {c1: [1,5], c2: [1,9]}, icon: '📜' },
  { id: 'b2', name: 'Bloque II: Melilla y el Estatuto de Autonomía', range: {c1: [6,6, 33,36], c2: [10,14]}, icon: '🏛️' },
  { id: 'b3', name: 'Bloque III: Procedimiento y Derecho Administrativo', range: {c1: [9,18], c2: ['E1','E5']}, icon: '⚖️' },
  { id: 'b4', name: 'Bloque IV: Contratación y Función Pública (TREBEP)', range: {c1: [19,25, 28,31], c2: ['E12','E13', 'E17','E17']}, icon: '🖋️' }
];

const ALL_DATA = [
  ...C1.map(x => ({...x, exam:'c1', id:'c1-'+x.num}))
  // ... rest of data
];

let state = {
  theme: localStorage.getItem('theme') || 'dark',
  exam: 'all', q: '',
  openBlocks: new Set(['b1', 'b2'])
};

function parseArts(text) {
  const parts = text.split(/\s\+\s/);
  return `<ul class="outline-list">${parts.map(p => {
    const subParts = p.split(/\s[—:]\s/);
    const main = subParts[0].replace(/Art[s]?\.\s*(\d+)/g, '<b>Art. $1</b>');
    const subs = subParts.slice(1);
    return `
      <li class="outline-item">
        ${main}
        ${subs.length ? `<ul class="sub-list">${subs.map(s => `<li class="sub-item">${s}</li>`).join('')}</ul>` : ''}
      </li>
    `;
  }).join('')}</ul>`;
}

function render() {
  const container = document.getElementById('content');
  const filtered = ALL_DATA.filter(d => (state.exam === 'all' || d.exam === state.exam) && (d.enunciado + d.num).toLowerCase().includes(state.q.toLowerCase()));

  const grouped = BLOCKS.map(b => ({
    ...b, items: filtered.filter(item => {
      const n = parseInt(item.num.substring(1));
      const r = item.exam === 'c1' ? b.range.c1 : b.range.c2;
      return n >= r[0] && n <= r[1];
    })
  })).filter(b => b.items.length > 0);

  container.innerHTML = grouped.map(block => `
    <div class="block-container ${state.openBlocks.has(block.id) ? 'open' : ''}">
      <div class="block-header" onclick="toggleBlock('${block.id}')">
        <div class="icon-wrap"><span>${block.icon}</span><h3>${block.name}</h3></div>
        <span style="font-size: 12px; font-weight: 800; opacity: 0.5;">${state.openBlocks.has(block.id) ? 'CERRAR' : 'ABRIR'}</span>
      </div>
      <div class="block-content" style="${state.openBlocks.has(block.id) ? 'display:block' : 'display:none'}">
        <div class="grid">
          ${block.items.map(item => `
            <article class="card" onclick="openModal('${item.id}')">
              <div class="card-num">${item.num} · ESTRATEGIA</div>
              <h2 class="card-title">${item.enunciado}</h2>
            </article>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

window.toggleBlock = (id) => {
  if (state.openBlocks.has(id)) state.openBlocks.delete(id);
  else state.openBlocks.add(id);
  render();
};

window.openModal = (id) => {
  const item = ALL_DATA.find(d => d.id === id);
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div class="modal-header">
      <span style="font-weight:900; color:var(--melilla-gold); letter-spacing:2px;">FICHA ESTRATÉGICA · ${item.num}</span>
      <h2>${item.enunciado}</h2>
    </div>
    <div class="laws-container">
      ${item.leyes.map(l => `
        <div class="law-block">
          <div class="law-title">📚 ${l.n}</div>
          ${parseArts(l.arts)}
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('modal').style.display = 'grid';
  document.body.style.overflow = 'hidden';
};

window.closeModal = () => {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = 'auto';
};

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => s.classList.toggle('active', s.dataset.v === state.theme));
}

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => { state.q = e.target.value; render(); };

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

window.onclick = (e) => { if (e.target.id === 'modal') closeModal(); };

setUI();
render();
</script>
</body></html>
