<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Editorial Study Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --bg: #05070a;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --accent: #00a2ff;
  --gold: #ffcc00;
  --liquid-1: rgba(0, 162, 255, 0.15);
  --liquid-2: rgba(255, 204, 0, 0.1);
  --shadow: 0 20px 50px rgba(0,0,0,0.5);
}

:root[data-theme="light"] {
  --bg: #f8fafc;
  --surface: rgba(255, 255, 255, 0.8);
  --surface-hover: rgba(255, 255, 255, 0.95);
  --line: rgba(0, 0, 0, 0.05);
  --text: #0f172a;
  --text-muted: #64748b;
  --accent: #2563eb;
  --gold: #b45309;
  --liquid-1: rgba(37, 99, 235, 0.05);
  --liquid-2: rgba(245, 158, 11, 0.05);
  --shadow: 0 20px 40px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; transition: background-color 0.4s, color 0.4s; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.liquid { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; animation: drift 20s infinite alternate; }
.l1 { width: 600px; height: 600px; background: var(--liquid-1); top: -200px; left: -100px; }
.l2 { width: 500px; height: 500px; background: var(--liquid-2); bottom: -100px; right: -100px; animation-delay: -5s; }

@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px, 20px) scale(1.05); } }

.app { max-width: 1400px; margin: auto; padding: 40px 24px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 50px; }
.brand h1 { font-family: 'Playfair Display', serif; font-size: 48px; letter-spacing: -2px; margin: 0; }
.brand p { color: var(--text-muted); margin: 6px 0 0; font-size: 18px; font-weight: 600; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 6px; border-radius: 12px; cursor: pointer; display: flex; gap: 4px; backdrop-filter: blur(10px); }
.toggle span { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; }
.toggle .active { background: var(--accent); color: white; }

.nav-bar { display: flex; gap: 16px; margin-bottom: 40px; align-items: center; position: sticky; top: 20px; z-index: 100; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 14px 20px; border-radius: 18px; backdrop-filter: blur(25px); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 16px; outline: none; }
.filter-tabs { display: flex; background: var(--surface); padding: 6px; border-radius: 18px; border: 1px solid var(--line); backdrop-filter: blur(25px); }
.tab { border: none; background: none; color: var(--text-muted); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 13px; }
.tab.active { background: var(--surface-hover); color: var(--text); }

.block-group { margin-bottom: 60px; }
.block-header { 
  font-size: 11px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 3px;
  margin-bottom: 30px; display: flex; align-items: center; gap: 15px; opacity: 0.7;
}
.block-header::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 24px; }

/* Card Style */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 32px; padding: 32px;
  backdrop-filter: blur(40px) saturate(200%); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 20px; position: relative; cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.1, 0.8, 0.2, 1), border-color 0.4s;
}
.card:hover { transform: scale(1.02); border-color: var(--accent); }

.card-top { display: flex; justify-content: space-between; align-items: center; }
.card-num { font-size: 14px; font-weight: 800; color: var(--gold); }
.badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); }

.card-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0; }

.law-summary { display: flex; flex-direction: column; gap: 8px; }
.law-summary-item { font-size: 13px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
.law-summary-item::before { content: "•"; color: var(--accent); }

.card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
.prog-chip { 
  font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 10px; 
  background: var(--surface-hover); border: 1px solid var(--line);
}
.prog-Dominado { color: #10b981; border-color: rgba(16,185,129,0.3); }
.prog-Leído { color: var(--accent); border-color: rgba(0,162,255,0.3); }

/* Modal Style */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
  z-index: 1000; display: none; place-items: center; padding: 20px;
}
.modal-content {
  background: var(--bg); border: 1px solid var(--line); border-radius: 40px;
  width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto;
  position: relative; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
  padding: 60px; animation: modalIn 0.5s cubic-bezier(0.1, 0.8, 0.2, 1);
}
@keyframes modalIn { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.close-modal { position: absolute; top: 30px; right: 30px; cursor: pointer; opacity: 0.5; font-size: 24px; }
.close-modal:hover { opacity: 1; }

.modal-header { text-align: center; margin-bottom: 50px; }
.modal-header h2 { font-family: 'Playfair Display', serif; font-size: 42px; margin: 0; }
.modal-header .subtitle { color: var(--gold); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; margin-top: 10px; }

.modal-body { line-height: 1.8; font-size: 17px; color: var(--text); }
.modal-section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.modal-section h3 { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 24px; margin-bottom: 15px; }

.law-block { background: var(--surface); border-radius: 24px; padding: 30px; border: 1px solid var(--line); margin-bottom: 24px; }
.law-title { font-weight: 800; color: var(--gold); margin-bottom: 12px; display: block; font-size: 15px; }
.law-text { font-style: italic; color: var(--text-muted); font-size: 15px; }

.pdf-btn { 
  display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: white;
  border: none; padding: 12px 24px; border-radius: 14px; font-weight: 800; cursor: pointer;
  margin-top: 20px; font-size: 14px;
}

@media print {
  body * { visibility: hidden; background: white !important; color: black !important; }
  .modal-overlay { position: static; display: block !important; background: none !important; backdrop-filter: none !important; }
  .modal-content { visibility: visible; border: none; box-shadow: none; padding: 0; max-height: none; width: 100%; position: static; }
  .modal-content * { visibility: visible; }
  .pdf-btn, .close-modal, .toggle, .nav-bar { display: none !important; }
}

@media (max-width: 768px) {
  .modal-content { padding: 30px; border-radius: 0; max-height: 100vh; }
  .modal-header h2 { font-size: 32px; }
}
</style>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p>The Strategist — 2026</p></div>
    <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Busca por tema, ley o palabra clave..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1</button>
      <button class="tab" data-exam="c2">C2</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">✕</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const LAW_URLS = {
  'Constitución': 'https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229',
  'Ley 39/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565',
  'Ley 40/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566',
  'TREBEP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719',
  'LCSP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902',
  'Estatuto': 'https://www.boe.es/buscar/act.php?id=BOE-A-1995-6544'
};

const C1 = [
  {num:"T1", enunciado:"La Constitución Española: Características y Derechos Fundamentales.", leyes:[{n:"Constitución Española", arts:"Título Preliminar y Título I (Arts. 1-55)"}]},
  {num:"T6", enunciado:"Estatuto de Autonomía de Melilla: Organización y Competencias.", leyes:[{n:"Estatuto de Melilla", arts:"Título I y II (Arts. 1-27)"}]},
  {num:"T19", enunciado:"Contratos del Sector Público: Tipos y SARA.", leyes:[{n:"Ley 9/2017 (LCSP)", arts:"Arts. 1-27"}]},
  {num:"T25", enunciado:"Contratos Menores: Límites y Procedimiento.", leyes:[{n:"Ley 9/2017 (LCSP)", arts:"Art. 118"}]},
  {num:"T28", enunciado:"TREBEP: Personal al servicio de AAPP.", leyes:[{n:"RDL 5/2015 (TREBEP)", arts:"Arts. 1-13, 55-62"}]}
];

const C2 = [
  {num:"T1", enunciado:"La Constitución Española: Título Preliminar.", leyes:[{n:"Constitución Española", arts:"Arts. 1-9"}]},
  {num:"E13", enunciado:"Contratos Menores en Auxiliar Administrativo.", leyes:[{n:"Ley 9/2017 (LCSP)", arts:"Art. 118"}]}
];

// DATA Preparation with UNIQUE IDs
const ALL_DATA = [
  ...C1.map(x => ({...x, exam:'c1', id:'c1-'+x.num})),
  ...C2.map(x => ({...x, exam:'c2', id:'c2-'+x.num}))
];

let state = {
  theme: localStorage.getItem('theme') || 'dark',
  exam: 'all',
  q: '',
  progress: JSON.parse(localStorage.getItem('progress') || '{}')
};

function render() {
  const container = document.getElementById('content');
  const filtered = ALL_DATA.filter(d => {
    const matchExam = state.exam === 'all' || d.exam === state.exam;
    const matchSearch = (d.enunciado + d.num).toLowerCase().includes(state.q.toLowerCase());
    return matchExam && matchSearch;
  });

  container.innerHTML = `<div class="grid">${filtered.map(item => {
    const prog = state.progress[item.id] || 'Pendiente';
    return `
      <article class="card" onclick="openModal('${item.id}')">
        <div class="card-top">
          <span class="card-num">${item.num} · ${item.exam.toUpperCase()}</span>
          <span class="badge">Estrategia</span>
        </div>
        <h2 class="card-title">${item.enunciado}</h2>
        <div class="law-summary">
          ${item.leyes.map(l => `<div class="law-summary-item">${l.n}</div>`).join('')}
        </div>
        <div class="card-footer">
          <span class="prog-chip prog-${prog}">${prog}</span>
          <div style="font-size: 11px; color: var(--accent); font-weight: 800;">Estudiar →</div>
        </div>
      </article>
    `;
  }).join('')}</div>`;
}

window.openModal = (id) => {
  const item = ALL_DATA.find(d => d.id === id);
  const prog = state.progress[id] || 'Pendiente';
  const modal = document.getElementById('modal');
  const body = document.getElementById('modalBody');

  body.innerHTML = `
    <div class="modal-header">
      <div class="subtitle">${item.exam.toUpperCase()} · TEMA ${item.num}</div>
      <h2>${item.enunciado}</h2>
      <select class="prog-select" onchange="updateProg('${id}', this.value); closeModal()" style="margin-top: 20px;">
        <option value="Pendiente" ${prog === 'Pendiente' ? 'selected' : ''}>⭕ Marcar como Pendiente</option>
        <option value="Leído" ${prog === 'Leído' ? 'selected' : ''}>🔷 Marcar como Leído</option>
        <option value="Dominado" ${prog === 'Dominado' ? 'selected' : ''}>✅ Marcar como Dominado</option>
      </select>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <h3>Estructura Normativa</h3>
        ${item.leyes.map(l => `
          <div class="law-block">
            <span class="law-title">${l.n}</span>
            <p style="margin: 0 0 10px;">Artículos clave: <strong>${l.arts}</strong></p>
            <p class="law-text">"El estudio de esta sección es fundamental para dominar el bloque. Revisa especialmente la literalidad de los artículos mencionados."</p>
          </div>
        `).join('')}
      </div>
      <div class="modal-section">
        <h3>🎯 Guía de Estudio</h3>
        <p>Este tema se centra en la base del ordenamiento. No pases al siguiente bloque sin dominar la jerarquía normativa establecida en los artículos citados.</p>
      </div>
      <button class="pdf-btn" onclick="window.print()">📥 Exportar Ficha de Estudio (PDF)</button>
    </div>
  `;
  modal.style.display = 'grid';
  document.body.style.overflow = 'hidden';
};

window.closeModal = () => {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = 'auto';
};

window.updateProg = (id, val) => {
  state.progress[id] = val;
  localStorage.setItem('progress', JSON.stringify(state.progress));
  render();
};

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => {
    s.classList.toggle('active', s.dataset.v === state.theme);
  });
}

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => {
  state.q = e.target.value;
  render();
};

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

window.onclick = (e) => {
  if (e.target.id === 'modal') closeModal();
};

setUI();
render();
</script>
</body></html>
