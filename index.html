<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Outline Study Method</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;700;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --bg: #05070a; --surface: rgba(255, 255, 255, 0.04); --surface-hover: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1); --text: #ffffff; --text-muted: rgba(255, 255, 255, 0.6);
  --accent: #00a2ff; --gold: #ffcc00; --liquid-1: rgba(0, 162, 255, 0.15); --liquid-2: rgba(255, 204, 0, 0.1);
  --shadow: 0 20px 50px rgba(0,0,0,0.5);
}

:root[data-theme="light"] {
  --bg: #f8fafc; --surface: rgba(255, 255, 255, 0.8); --surface-hover: rgba(255, 255, 255, 0.95);
  --line: rgba(0, 0, 0, 0.05); --text: #0f172a; --text-muted: #64748b;
  --accent: #2563eb; --gold: #b45309; --liquid-1: rgba(37, 99, 235, 0.05); --liquid-2: rgba(245, 158, 11, 0.05);
  --shadow: 0 20px 40px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; transition: background-color 0.4s, color 0.4s; }
body { margin: 0; min-height: 100vh; font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

.liquid { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; animation: drift 20s infinite alternate; }
.l1 { width: 600px; height: 600px; background: var(--liquid-1); top: -200px; left: -100px; }
.l2 { width: 500px; height: 500px; background: var(--liquid-2); bottom: -100px; right: -100px; }

@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px, 20px) scale(1.05); } }

.app { max-width: 1400px; margin: auto; padding: 40px 24px; }

header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
.brand h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin: 0; letter-spacing: -1.5px; }
.brand p { color: var(--text-muted); margin: 6px 0 0; font-size: 16px; font-weight: 600; }

.toggle { background: var(--surface); border: 1px solid var(--line); padding: 5px; border-radius: 12px; cursor: pointer; display: flex; gap: 4px; backdrop-filter: blur(10px); }
.toggle span { padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; }
.toggle .active { background: var(--accent); color: white; }

.nav-bar { display: flex; gap: 16px; margin-bottom: 40px; position: sticky; top: 20px; z-index: 100; }
.search-box { flex: 1; background: var(--surface); border: 1px solid var(--line); padding: 12px 20px; border-radius: 16px; backdrop-filter: blur(25px); }
.search-box input { background: none; border: none; color: var(--text); width: 100%; font-size: 16px; outline: none; }
.filter-tabs { display: flex; background: var(--surface); padding: 5px; border-radius: 16px; border: 1px solid var(--line); backdrop-filter: blur(25px); }
.tab { border: none; background: none; color: var(--text-muted); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px; }
.tab.active { background: var(--surface-hover); color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 24px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 32px; padding: 32px;
  backdrop-filter: blur(40px) saturate(200%); box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 18px; cursor: pointer;
}
.card:hover { transform: translateY(-5px); border-color: var(--accent); }
.card-num { font-size: 13px; font-weight: 800; color: var(--gold); }
.card-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; }

/* Modal & Outline Style */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
  z-index: 1000; display: none; place-items: center; padding: 20px;
}
.modal-content {
  background: var(--bg); border: 1px solid var(--line); border-radius: 40px;
  width: 100%; max-width: 1000px; max-height: 90vh; overflow-y: auto;
  position: relative; padding: 60px;
}
.close-modal { position: absolute; top: 30px; right: 30px; cursor: pointer; opacity: 0.5; font-size: 24px; }

.outline-container { margin-top: 40px; }
.outline-section { margin-bottom: 30px; }
.outline-h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--gold); border-bottom: 2px solid var(--line); padding-bottom: 8px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.outline-h2 { font-weight: 800; font-size: 17px; margin: 16px 0 8px 24px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.outline-h2::before { content: "•"; }
.outline-item { margin: 6px 0 6px 48px; font-size: 15px; color: var(--text); line-height: 1.6; display: flex; gap: 10px; }
.outline-item::before { content: "—"; opacity: 0.4; }
.idea-principal { font-weight: 700; color: var(--text); }
.idea-generica { color: var(--text-muted); font-size: 14px; }

.pdf-btn { 
  display: block; width: 100%; max-width: 300px; margin: 40px auto 0;
  background: var(--accent); color: white; border: none; padding: 16px 32px;
  border-radius: 16px; font-weight: 800; cursor: pointer; text-align: center;
}

@media print {
  .modal-overlay { position: static; display: block !important; background: white !important; }
  .modal-content { border: none; padding: 0; box-shadow: none; width: 100%; max-width: none; color: black !important; background: white !important; }
  .close-modal, .pdf-btn, header, .nav-bar { display: none !important; }
  .outline-h1 { color: #b45309 !important; border-color: #eee !important; }
  .outline-h2 { color: #2563eb !important; }
  .idea-principal { color: black !important; }
  .idea-generica { color: #666 !important; }
}

@media (max-width: 768px) {
  .modal-content { padding: 30px; }
  .outline-h1 { font-size: 22px; }
  .outline-h2 { margin-left: 10px; }
  .outline-item { margin-left: 20px; }
}
</style>
</head>
<body>

<div class="liquid l1"></div><div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand"><h1>TemarioCAM</h1><p>Metodología Outline Method</p></div>
    <div class="toggle" id="themeToggle"><span data-v="light">Claro</span><span data-v="dark" class="active">Oscuro</span></div>
  </header>

  <div class="nav-bar">
    <div class="search-box"><input type="text" id="search" placeholder="Busca por tema o concepto..." /></div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1</button>
      <button class="tab" data-exam="c2">C2</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">✕</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const STUDY_DATA = {
  'c1-t1': {
    title: 'La Constitución Española: Título Preliminar',
    sections: [
      {
        h1: 'I. El Estado Español (Art. 1)',
        items: [
          { h2: 'Configuración y Valores', sub: [
            { p: 'Estado social y democrático de Derecho.', type: 'main' },
            { p: 'Valores superiores: Libertad, justicia, igualdad y pluralismo político.', type: 'main' }
          ]},
          { h2: 'Soberanía y Forma Política', sub: [
            { p: 'La soberanía reside en el pueblo español (emanan los poderes).', type: 'main' },
            { p: 'Forma política: Monarquía parlamentaria.', type: 'gen' }
          ]}
        ]
      },
      {
        h1: 'II. Unidad y Autonomía (Art. 2)',
        items: [
          { h2: 'Principios Fundamentales', sub: [
            { p: 'Indisoluble unidad de la Nación española (patria común e indivisible).', type: 'main' },
            { p: 'Garantiza el derecho a la autonomía de nacionalidades y regiones.', type: 'main' },
            { p: 'Principio de solidaridad entre todas ellas.', type: 'gen' }
          ]}
        ]
      },
      {
        h1: 'IX. Sujeción a la Constitución (Art. 9)',
        items: [
          { h2: 'Principios Garantizados (Muy Importante)', sub: [
            { p: 'Legalidad y Jerarquía normativa.', type: 'main' },
            { p: 'Publicidad de las normas e Irretroactividad.', type: 'main' },
            { p: 'Seguridad jurídica y Responsabilidad de los poderes públicos.', type: 'gen' },
            { p: 'Interdicción de la arbitrariedad.', type: 'main' }
          ]}
        ]
      }
    ]
  }
};

const DATA = [
  { id: 'c1-t1', exam: 'c1', num: 'T1', enunciado: 'Constitución Española: Título Preliminar y Derechos Fundamentales' },
  { id: 'c1-t6', exam: 'c1', num: 'T6', enunciado: 'Estatuto de Melilla: Competencias y Organización' },
  { id: 'c1-t19', exam: 'c1', num: 'T19', enunciado: 'Contratación del Sector Público (LCSP)' }
];

let state = { theme: localStorage.getItem('theme') || 'dark', exam: 'all', q: '' };

function render() {
  const grid = document.getElementById('content');
  const filtered = DATA.filter(d => (state.exam === 'all' || d.exam === state.exam) && d.enunciado.toLowerCase().includes(state.q.toLowerCase()));

  grid.innerHTML = `<div class="grid">${filtered.map(item => `
    <article class="card" onclick="openModal('${item.id}')">
      <div class="card-num">${item.num} · ${item.exam.toUpperCase()}</div>
      <h2 class="card-title">${item.enunciado}</h2>
      <div style="margin-top:auto; font-size: 11px; font-weight: 800; color: var(--accent);">MÉTODO OUTLINE DISPONIBLE →</div>
    </article>
  `).join('')}</div>`;
}

window.openModal = (id) => {
  const content = STUDY_DATA[id];
  const item = DATA.find(d => d.id === id);
  const body = document.getElementById('modalBody');

  if (!content) {
    body.innerHTML = `<h2 style="font-family:'Playfair Display'">${item.enunciado}</h2><p>Contenido detallado en preparación...</p>`;
  } else {
    body.innerHTML = `
      <div style="text-align:center; margin-bottom: 40px;">
        <div style="font-size:12px; font-weight:900; color:var(--gold); letter-spacing:2px;">FICHA DE ESTUDIO · OUTLINE METHOD</div>
        <h2 style="font-family:'Playfair Display'; font-size:42px; margin:10px 0;">${content.title}</h2>
      </div>
      <div class="outline-container">
        ${content.sections.map(sec => `
          <div class="outline-section">
            <div class="outline-h1">${sec.h1}</div>
            ${sec.items.map(it => `
              <div class="outline-h2">${it.h2}</div>
              ${it.sub.map(s => `
                <div class="outline-item ${s.type === 'main' ? 'idea-principal' : 'idea-generica'}">${s.p}</div>
              `).join('')}
            `).join('')}
          </div>
        `).join('')}
      </div>
      <button class="pdf-btn" onclick="window.print()">📥 DESCARGAR FICHA PDF</button>
    `;
  }
  document.getElementById('modal').style.display = 'grid';
};

window.closeModal = () => document.getElementById('modal').style.display = 'none';

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => s.classList.toggle('active', s.dataset.v === state.theme));
}

document.getElementById('themeToggle').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => { state.q = e.target.value; render(); };

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

setUI();
render();
</script>
</body></html>
