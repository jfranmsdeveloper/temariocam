<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TemarioCAM — Fluent Liquid</title>
<style>
:root[data-theme="dark"] {
  --bg: #05070a;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.6);
  --accent: #00a2ff;
  --gold: #ffcc00;
  --liquid-1: rgba(0, 162, 255, 0.2);
  --liquid-2: rgba(255, 204, 0, 0.15);
  --shadow: 0 20px 50px rgba(0,0,0,0.5);
}

:root[data-theme="light"] {
  --bg: #f5f7fa;
  --surface: rgba(255, 255, 255, 0.7);
  --surface-hover: rgba(255, 255, 255, 0.9);
  --line: rgba(0, 0, 0, 0.05);
  --text: #1d1d1f;
  --text-muted: rgba(0, 0, 0, 0.5);
  --accent: #0071e3;
  --gold: #bf8f00;
  --liquid-1: rgba(0, 113, 227, 0.1);
  --liquid-2: rgba(255, 149, 0, 0.1);
  --shadow: 0 20px 40px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; transition: background-color 0.4s, color 0.4s, border-color 0.4s; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Fluent Backgrounds */
.liquid {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  z-index: -1;
  pointer-events: none;
  animation: drift 20s infinite alternate;
}
.l1 { width: 600px; height: 600px; background: var(--liquid-1); top: -200px; left: -100px; }
.l2 { width: 500px; height: 500px; background: var(--liquid-2); bottom: -100px; right: -100px; animation-delay: -5s; }

@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to { transform: translate(50px, 30px) scale(1.1); }
}

.app {
  max-width: 1200px;
  margin: auto;
  padding: 40px 24px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 60px;
}

.brand h1 {
  font-size: 42px;
  letter-spacing: -1.5px;
  margin: 0;
  font-weight: 800;
}
.brand p {
  color: var(--text-muted);
  margin: 8px 0 0;
  font-size: 18px;
}

/* Theme Toggle */
.toggle {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 8px;
  border-radius: 14px;
  cursor: pointer;
  display: flex;
  gap: 4px;
  backdrop-filter: blur(10px);
}
.toggle span {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.toggle .active {
  background: var(--accent);
  color: white;
}

/* Search & Filters */
.nav-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 40px;
  align-items: center;
}
.search-box {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 14px 20px;
  border-radius: 18px;
  backdrop-filter: blur(20px);
}
.search-box input {
  background: none;
  border: none;
  color: var(--text);
  width: 100%;
  font-size: 16px;
  outline: none;
}
.filter-tabs {
  display: flex;
  background: var(--surface);
  padding: 6px;
  border-radius: 18px;
  border: 1px solid var(--line);
}
.tab {
  border: none;
  background: none;
  color: var(--text-muted);
  padding: 10px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}
.tab.active {
  background: var(--surface-hover);
  color: var(--text);
}

/* Grid Layout */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 24px;
}

/* Fluent Card */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 32px;
  padding: 30px;
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: relative;
  overflow: hidden;
}
.card:hover {
  background: var(--surface-hover);
  transform: scale(1.02);
  transition: 0.4s cubic-bezier(0.1, 0.8, 0.2, 1);
}

.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.badge {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 8px;
}
.badge-high { background: rgba(255, 59, 48, 0.15); color: #ff3b30; }
.badge-mid { background: rgba(255, 159, 10, 0.15); color: #ff9f0a; }

.card-title {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  margin: 0;
}

.law-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.law-item {
  font-size: 14px;
  line-height: 1.5;
}
.law-item a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.law-item a:hover { text-decoration: underline; }
.law-item .arts {
  display: block;
  color: var(--text-muted);
  margin-top: 4px;
}

.focus-box {
  background: rgba(0, 162, 255, 0.05);
  padding: 12px 16px;
  border-radius: 16px;
  border-left: 4px solid var(--accent);
  font-size: 13px;
  font-weight: 500;
}

.footer-actions {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.prog-btn {
  background: var(--line);
  border: none;
  color: var(--text);
  padding: 8px 16px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

@media (max-width: 768px) {
  header { flex-direction: column; gap: 20px; }
  .nav-bar { flex-direction: column; align-items: stretch; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="liquid l1"></div>
<div class="liquid l2"></div>

<main class="app">
  <header>
    <div class="brand">
      <h1>TemarioCAM</h1>
      <p>Estrategia y Enfoque</p>
    </div>
    <div class="toggle" id="themeToggle">
      <span data-v="light">Claro</span>
      <span data-v="dark" class="active">Oscuro</span>
    </div>
  </header>

  <div class="nav-bar">
    <div class="search-box">
      <input type="text" id="search" placeholder="Busca leyes o temas..." />
    </div>
    <div class="filter-tabs">
      <button class="tab active" data-exam="all">Todo</button>
      <button class="tab" data-exam="c1">C1</button>
      <button class="tab" data-exam="c2">C2</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<script>
const LAW_URLS = {
  'Constitución Española': 'https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229',
  'Ley 39/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565',
  'Ley 40/2015': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10566',
  'TREBEP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-11719',
  'LCSP': 'https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902',
  'Estatuto de Autonomía de Melilla': 'https://www.boe.es/buscar/act.php?id=BOE-A-1995-6544'
};

const DATA = [
  {id:'t1', exam:'c1', num:'T1', title:'Constitución y Derechos', prio:'high', focus:'Enfoque total en arts. 14 a 29 (Derechos Fundamentales).', laws:[{n:'Constitución Española', arts:'Título I'}]},
  {id:'t6', exam:'c1', num:'T6', title:'Estatuto de Melilla', prio:'high', focus:'Memorizar art. 21.1 (Materias exclusivas).', laws:[{n:'Estatuto de Autonomía de Melilla', arts:'Títulos I y II'}]},
  {id:'t10', exam:'c1', num:'T10', title:'Interesado y Representación', prio:'mid', focus:'Diferencia clara entre art. 4, 5 y 6.', laws:[{n:'Ley 39/2015', arts:'Arts. 3-12'}]},
  {id:'t19', exam:'c1', num:'T19', title:'Contratos del Sector Público', prio:'high', focus:'Umbrales SARA (Obras > 5.5M / Serv > 221k).', laws:[{n:'LCSP', arts:'Arts. 1-27'}]},
  {id:'t25', exam:'c1', num:'T25', title:'Contratos Menores', prio:'high', focus:'Límites 15k/40k y prohibición de fraccionamiento.', laws:[{n:'LCSP', arts:'Art. 118'}]},
  {id:'t28', exam:'c1', num:'T28', title:'Personal al Servicio AAPP', prio:'mid', focus:'Requisitos de acceso (Art. 56).', laws:[{n:'TREBEP', arts:'Arts. 1-13'}]}
];

let state = {
  theme: localStorage.getItem('theme') || 'dark',
  exam: 'all',
  q: '',
  progress: JSON.parse(localStorage.getItem('progress') || '{}')
};

function setUI() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelectorAll('#themeToggle span').forEach(s => {
    s.classList.toggle('active', s.dataset.v === state.theme);
  });
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = DATA.filter(d => {
    return (state.exam === 'all' || d.exam === state.exam) && 
           (d.title.toLowerCase().includes(state.q.toLowerCase()) || d.num.toLowerCase().includes(state.q.toLowerCase()));
  });

  grid.innerHTML = filtered.map(item => {
    const prog = state.progress[item.id] || 'Pendiente';
    return `
      <article class="card">
        <div class="card-meta">
          <span style="font-weight: 800; font-size: 14px; opacity: 0.5">${item.num} · ${item.exam.toUpperCase()}</span>
          <span class="badge badge-${item.prio}">${item.prio === 'high' ? 'Crítico' : 'Importante'}</span>
        </div>
        <h2 class="card-title">${item.title}</h2>
        <div class="law-list">
          ${item.laws.map(l => `
            <div class="law-item">
              <a href="${LAW_URLS[l.n] || '#'}" target="_blank">${l.n} ↗</a>
              <span class="arts">${l.arts}</span>
            </div>
          `).join('')}
        </div>
        <div class="focus-box">🎯 Al grano: ${item.focus}</div>
        <div class="footer-actions">
          <button class="prog-btn" onclick="toggleProg('${item.id}')">${prog}</button>
        </div>
      </article>
    `;
  }).join('');
}

window.toggleProg = (id) => {
  const steps = ['Pendiente', 'Leído', 'Dominado'];
  let cur = steps.indexOf(state.progress[id] || 'Pendiente');
  state.progress[id] = steps[(cur + 1) % 3];
  localStorage.setItem('progress', JSON.stringify(state.progress));
  render();
};

document.getElementById('themeToggle').onclick = (e) => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', state.theme);
  setUI();
};

document.getElementById('search').oninput = (e) => {
  state.q = e.target.value;
  render();
};

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    t.classList.add('active');
    state.exam = t.dataset.exam;
    render();
  };
});

setUI();
render();
</script>
</body>
</html>
